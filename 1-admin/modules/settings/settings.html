<section class="screen" id="screen-settings">
  <div class="page-head">
    <div>
      <h1 class="display">Settings</h1>
      <p class="sub">Profile, appearance, and system preferences</p>
    </div>
  </div>
  <div class="two-col">
    <div>
      <div class="section-title" style="margin-top:0;"><h2>Profile</h2></div>
      <div class="card card-pad">
        <div class="form-grid">
          <div class="field"><label>Full Name</label><input type="text" value="Rowena Santos"/></div>
          <div class="field"><label>Role</label><input type="text" value="Admin" readonly/></div>
          <div class="field"><label>Email</label><input type="text" value="rowena.santos@buildright.co"/></div>
          <div class="field"><label>Phone</label><input type="text" value="+63 917 000 0000"/></div>
        </div>
        <button class="btn btn-primary" style="margin-top:6px;">Save Changes</button>
      </div>
    </div>
    <div>
      <div class="section-title" style="margin-top:0;"><h2>Appearance</h2></div>
      <div class="card card-pad" style="display:flex; align-items:center; justify-content:space-between;">
        <div>
          <div style="font-weight:700; font-size:13.5px;">Night Mode</div>
          <div class="cell-sub">Switch the interface to a dark theme</div>
        </div>
        <button class="btn btn-secondary btn-sm" onclick="toggleTheme()">Toggle</button>
      </div>
      <div class="section-title"><h2>Notifications</h2></div>
      <div class="card card-pad">
        <div class="kv"><span class="k">Overdue returns</span><span class="v">On</span></div>
        <div class="kv"><span class="k">Low stock alerts</span><span class="v">On</span></div>
        <div class="kv"><span class="k">Missing tool reports</span><span class="v">On</span></div>
        <div class="kv"><span class="k">Weekly monitoring reminders</span><span class="v">On</span></div>
      </div>
    </div>
  </div>
</section>
