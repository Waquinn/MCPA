<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MCPA — Construction Asset &amp; Accountability System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,340;9..144,480;9..144,560&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/global.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/theme.css">
<link rel="stylesheet" href="../css/movement.css">
<link rel="stylesheet" href="../css/movement-overview.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

<!-- ============================================================
     APP SHELL
     ============================================================ -->
<div id="app-shell">

  <!-- SIDEBAR -->
  <aside id="sidebar">
    <div class="brand">
      <div class="brand-mark">MCPA</div>
      <div>
        <div class="brand-name">MCPA</div>
        <div class="brand-sub">BuildRight Corp.</div>
      </div>
    </div>
    <nav class="nav" id="nav-list"></nav>
    <div class="sidebar-foot">
      <div class="avatar">E.S</div>
      <div class="who">
        <div class="name">Engr Sky</div>
        <div class="role">Engineer / Architect</div>
      </div>
      <button class="icon-btn" title="Log out" onclick="logout()">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
      </button>
    </div>
  </aside>

  <!-- MAIN -->
  <div id="main-col">
    <header id="topbar">
      <button class="icon-btn mobile-menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')" style="display: none;">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="search-wrap">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
        <input type="text" placeholder="Search tool ID, name, serial, project, holder…" oninput="globalSearch(this.value)"/>
      </div>
      <div class="topbar-spacer"></div>
      <div class="topbar-actions">
        <button class="theme-toggle" onclick="toggleTheme()">
          <svg id="theme-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
          <span id="theme-label">Night mode</span>
        </button>
        <button class="icon-btn bell-wrap" title="Activity logs" style="color:var(--black); border:1px solid var(--line); width:36px; height:36px; border-radius:8px;" onclick="showScreen('activity')">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 01-3.46 0"/></svg>
          <span class="bell-dot"></span>
        </button>
        <div class="avatar" style="width:36px;height:36px;">E.S</div>
      </div>
    </header>

    <!-- Module container: showScreen()/loadModule() (js/navigation.js,
         js/app.js) fetch each screen's HTML/CSS/JS into here on demand. -->
    <div id="movement-context"></div>
    <main id="content"></main>
  </div>
</div>

<script src="../js/data.js"></script>
<script src="../js/equipment-visual.js"></script>
<script src="../js/equipment-tracking.js"></script>
<script src="../js/movement-store.js"></script>
<script src="../js/movement-cloud.js"></script>
<script src="../js/movement-ui.js"></script>
<script src="../js/movement-overview.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/navigation.js"></script>
<script src="../js/app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // Initialize the app immediately since we bypassed the login screen
  window.onload = () => {
    buildNav();
    showScreen(location.hash.slice(1) in SCREEN_MODULE ? location.hash.slice(1) : 'dashboard');
  };
</script>
<!-- Add this new scanner library -->
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>



</body>
</html>
