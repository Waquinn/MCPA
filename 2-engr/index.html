<script>try { document.body.classList.toggle('dark', localStorage.getItem('mcpa.theme') === 'dark'); } catch (_) {}</script>

<!-- ============================================================
     APP SHELL
     ============================================================ -->
<div id="login-screen">
  <section class="login-gallery" aria-label="MCPA completed projects">
    <div id="login-slideshow" class="login-slideshow" aria-hidden="true">
      <div class="login-slide" data-project="10"><div class="login-scene">
        <picture>
          <img class="login-photo" src="../images/login-slideshow/project-10.jpg" alt="" width="3200" height="2132" fetchpriority="high" decoding="async">
        </picture>
      </div></div>
      <picture class="login-mobile-backdrop">
        <img class="login-mobile-photo" src="../images/login-slideshow/project-10.jpg" alt="" width="3200" height="2132" decoding="async">
      </picture>
    </div>
  </section>
  <div id="login-content"><p role="status">Checking your session...</p></div>
  <div class="login-gallery-footer" role="group" aria-label="Project gallery controls">
    <span class="login-photo-counter" data-login-counter aria-live="polite" aria-label="Photograph 1 of 10"><span data-login-number>01</span> / 10</span>
    <div class="login-gallery-controls">
      <div class="login-gallery-progress" aria-hidden="true"><span data-login-progress></span></div>
      <button class="login-photo-step" type="button" data-login-step="-1" aria-label="Previous photograph" aria-controls="login-slideshow" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg>
      </button>
      <button class="login-photo-step" type="button" data-login-step="1" aria-label="Next photograph" aria-controls="login-slideshow" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 6 6 6-6 6"/></svg>
      </button>
    </div>
    </div>
</div>
<script src="../js/login-slideshow.js"></script>
<div id="app-shell" class="hidden">

  <!-- SIDEBAR -->
  <aside id="sidebar">
    <div class="brand">
      <div class="brand-mark">MCPA</div>
      <div>
        <div class="brand-name">MCPA</div>
        <div class="brand-sub">BuildRight Corp.</div>
      </div>
    </div>
    <nav class="nav" id="nav-list"></nav>
    <div class="sidebar-foot">
      <div class="avatar">E.S</div>
      <div class="who">
        <div class="name">Engr Sky</div>
        <div class="role">Engineer / Architect</div>
      </div>
      <button class="icon-btn" title="Log out" onclick="logout()">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
      </button>
    </div>
  </aside>

  <!-- MAIN -->
  <div id="main-col">
    <header id="topbar">
      <button class="icon-btn mobile-menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')" style="display: none;">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="search-wrap" id="global-search-panel">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
        <input id="global-search-input" type="search" placeholder="Search tool ID, equipment, serial, project, or holder&#8230;" aria-label="Search equipment by tool ID, name, serial, project or holder" oninput="globalSearch(this.value)"/>
        <button type="button" class="icon-btn mobile-search-close" aria-label="Close search" onclick="closeMobileSearch()"><svg aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></svg></button>
      </div>
      <div class="topbar-spacer"></div>
      <div class="topbar-actions">
        <button type="button" id="mobile-search-toggle" class="icon-btn mobile-search-toggle" aria-label="Search" aria-expanded="false" aria-controls="global-search-panel" onclick="openMobileSearch()"><svg aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg></button>
        <button class="theme-toggle" aria-label="Switch to night mode" onclick="toggleTheme(this)">
          <svg id="theme-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
          <span id="theme-label">Night mode</span>
        </button>
        <button class="icon-btn bell-wrap" title="Notifications" aria-label="Notifications" style="color:var(--black); border:1px solid var(--line); width:36px; height:36px; border-radius:8px;" onclick="MCPAMonitoring.open()">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 01-3.46 0"/></svg>
          <span class="bell-dot hidden" aria-hidden="true"></span>
        </button>
        <div class="avatar" style="width:36px;height:36px;">E.S</div>
      </div>
    </header>
    <nav class="mobile-history" aria-label="Screen history">
      <button type="button" id="mobile-back" class="mobile-back" aria-label="Go back to previous screen" hidden>
        <svg aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="m12 5-7 7 7 7M5 12h14"/></svg><span>Back</span>
      </button>
    </nav>

    <!-- Module container: showScreen()/loadModule() (js/navigation.js,
         js/app.js) fetch each screen's HTML/CSS/JS into here on demand. -->
    <div id="movement-context"></div>
    <main id="content"></main>
  </div>
</div>
