<section class="screen" id="screen-reports">
  <div class="page-head">
    <div><h1 class="display">Reports</h1><p class="sub">Equipment, movement and stock summaries</p></div>
    <div class="page-head-actions"><button class="btn btn-secondary btn-sm" data-action="refresh">Refresh</button><button class="btn btn-secondary btn-sm" data-action="export" disabled>Export CSV</button><button class="btn btn-primary btn-sm" data-action="print" disabled>Print / Save PDF</button></div>
  </div>
  <p id="reports-status" class="module-status" role="status" aria-live="polite">Loading reports…</p>
  <div class="tabs" role="tablist" aria-label="Report type">
    <button class="tab active" role="tab" aria-selected="true" data-report="equipment">Equipment</button>
    <button class="tab" role="tab" aria-selected="false" data-report="sites">Sites</button>
    <button class="tab" role="tab" aria-selected="false" data-report="movement">Movement</button>
    <button class="tab" role="tab" aria-selected="false" data-report="accountability">Accountability</button>
    <button class="tab" role="tab" aria-selected="false" data-report="missing">Missing</button>
    <button class="tab" role="tab" aria-selected="false" data-report="repairs">Repairs</button>
    <button class="tab" role="tab" aria-selected="false" data-report="purchases">Purchase requests</button>
    <button class="tab" role="tab" aria-selected="false" data-report="consumables">Consumables</button>
  </div>
  <div id="reports-kpis" class="grid grid-4"></div>
  <div class="table-toolbar" style="margin-top:20px"><div class="field"><label for="reports-search">Search this report</label><input id="reports-search" type="search" placeholder="Search report"></div><span id="reports-count"></span></div>
  <h2 id="reports-title" class="display">Equipment</h2>
  <div class="card" role="tabpanel"><div class="table-wrap"><table><thead id="reports-head"></thead><tbody id="reports-rows"></tbody></table></div></div>
  <div class="table-toolbar report-pagination" style="margin-top:12px"><button class="btn btn-secondary btn-sm" data-action="previous">Previous</button><span id="reports-page"></span><button class="btn btn-secondary btn-sm" data-action="next">Next</button></div>
</section>
