<section class="screen" id="screen-activity">
  <div class="page-head"><div><h1 class="display">Activity Logs</h1><p class="sub">Equipment movements and consumable stock history</p></div><div class="page-head-actions"><button class="btn btn-secondary" data-action="refresh">Refresh</button><button class="btn btn-secondary" data-action="export" disabled>Export CSV</button></div></div>
  <p id="activity-status" role="status" class="module-status">Loading history…</p>
  <div class="filter-row" style="margin:16px 0;display:flex;gap:12px;flex-wrap:wrap"><div class="field"><label for="activity-search">Search history</label><input id="activity-search" type="search" placeholder="Item, action, actor or notes"></div><div class="field"><label for="activity-source">Source</label><select id="activity-source"><option value="">All history</option><option value="Equipment">Equipment</option><option value="Consumables">Consumables</option></select></div></div>
  <div class="card"><div class="table-wrap"><table><thead id="activity-head"></thead><tbody id="activity-rows"></tbody></table></div></div>
  <div class="page-head-actions" style="margin-top:16px"><button class="btn btn-secondary" data-action="previous">Previous</button><span id="activity-page"></span><button class="btn btn-secondary" data-action="next">Next</button></div>
</section>
