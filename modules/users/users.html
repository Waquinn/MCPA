<section class="screen" id="screen-users">
  <div class="page-head"><div><h1 class="display">Users</h1><p class="sub">Team profiles and account details</p></div><button class="btn btn-secondary btn-sm" data-action="refresh">Refresh</button></div>
  <div class="section-title"><h2>Current session</h2></div>
  <div id="users-session" class="card card-pad"></div>
  <p class="module-note">Contact your administrator to invite users or change their access.</p>
  <div class="section-title"><h2>Profile directory</h2></div>
  <div class="table-toolbar"><div class="field"><label for="users-search">Search profiles</label><input type="search" id="users-search" placeholder="Name or profile ID"></div><span id="users-count"></span></div>
  <p id="users-status" class="module-status" role="status" aria-live="polite">Loading profiles…</p>
  <div class="card"><div class="table-wrap"><table><thead id="users-head"></thead><tbody id="users-rows"></tbody></table></div></div>
  <div class="table-toolbar" style="margin-top:12px"><button class="btn btn-secondary btn-sm" data-action="previous">Previous</button><span id="users-page"></span><button class="btn btn-secondary btn-sm" data-action="next">Next</button></div>
</section>
