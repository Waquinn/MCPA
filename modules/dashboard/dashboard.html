<section class="screen" id="screen-dashboard">
  <div class="page-head">
    <div><h1 class="display">Dashboard</h1><p class="sub">Current equipment, site assignments and stock records</p></div>
    <div class="page-head-actions"><button class="btn btn-secondary btn-sm" data-action="refresh">Refresh</button><button class="btn btn-accent btn-sm" data-screen="reports">Reports</button></div>
  </div>
  <p id="dashboard-status" class="module-status" role="status" aria-live="polite">Loading overview…</p>
  <div id="dashboard-kpis" class="grid grid-5" aria-label="Equipment summary"></div>
  <div class="two-col">
    <div>
      <div class="section-title"><h2>Needs attention</h2></div>
      <div id="dashboard-alerts"></div>
      <div class="section-title"><h2>Equipment status</h2></div>
      <div id="dashboard-distribution" class="card card-pad"></div>
    </div>
    <div>
      <div class="section-title"><h2>Quick actions</h2></div>
      <div class="card card-pad quick-actions">
        <button class="qa-btn" data-screen="masterlist">Manage equipment</button>
        <button class="qa-btn" data-screen="request">Request equipment</button>
        <button class="qa-btn" data-screen="transfer">Transfer equipment</button>
        <button class="qa-btn" data-screen="return">Return equipment</button>
        <button class="qa-btn" data-screen="missing">Report missing</button>
        <button class="qa-btn" data-screen="repair">Manage repairs</button>
        <button class="qa-btn" data-screen="purchase">Purchase requests</button>
      </div>
    </div>
  </div>
  <div class="section-title"><h2>Equipment by site</h2><button class="btn btn-secondary btn-sm" data-screen="sites">View sites</button></div>
  <div class="card"><div class="table-wrap"><table><thead id="dashboard-site-head"></thead><tbody id="dashboard-sites"></tbody></table></div></div>
</section>
