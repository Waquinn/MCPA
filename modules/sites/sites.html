<div id="sites-module">
  <div id="sites-feedback" class="sites-feedback hidden" role="status" aria-live="polite"></div>

  <section class="screen" id="screen-sites" aria-labelledby="sites-heading">
    <div class="page-head">
      <div>
        <h1 class="display" id="sites-heading">Sites</h1>
        <p class="sub">Every active project, and the tools currently living there</p>
      </div>
      <div class="page-head-actions">
        <button type="button" class="btn btn-secondary btn-sm" data-action="refresh">Refresh</button>
        <button type="button" class="btn btn-secondary btn-sm" data-action="add-site">+ Add Site</button>
      </div>
    </div>
    <div id="sites-list" class="grid grid-3" aria-live="polite" aria-busy="true">
      <div class="card empty-state sites-full"><p class="t">Loading sites…</p></div>
    </div>
  </section>

  <section class="screen" id="screen-site-detail" aria-labelledby="site-heading">
    <div id="site-detail-content">
      <button type="button" class="sites-back eyebrow" data-action="all-sites">← All Sites</button>
      <div class="card empty-state"><p class="t">Loading site details…</p></div>
    </div>
  </section>

  <dialog id="sites-dialog" class="sites-dialog" aria-labelledby="sites-dialog-title">
    <div class="sites-dialog-head">
      <h2 class="display" id="sites-dialog-title"></h2>
      <button type="button" class="icon-btn sites-close" data-action="close-dialog" aria-label="Close dialog">×</button>
    </div>
    <div id="sites-dialog-content"></div>
  </dialog>
</div>
