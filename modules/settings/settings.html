<section class="screen" id="screen-settings">
  <div class="page-head"><div><h1 class="display">Settings</h1><p class="sub">Account details and preferences for this browser</p></div></div>
  <div id="settings-feedback" class="app-feedback hidden" role="status"></div>
  <div class="two-col">
    <div>
      <div class="section-title" style="margin-top:0"><h2>Profile</h2></div>
      <div class="card card-pad" id="settings-profile"><p role="status">Loading account…</p></div>
    </div>
    <div>
      <div class="section-title" style="margin-top:0"><h2>Browser preferences</h2></div>
      <form id="settings-preferences" class="card card-pad">
        <div class="field"><label for="settings-theme">Appearance</label><select id="settings-theme" name="theme"><option value="light">Light</option><option value="dark">Dark</option></select></div>
        <div class="field"><label for="settings-page-size">Masterlist rows per page</label><select id="settings-page-size" name="pageSize"><option value="10">10</option><option value="25">25</option><option value="50">50</option></select></div>
        <div class="field"><label for="settings-start">Start page</label><select id="settings-start" name="defaultScreen"></select></div>
        <p class="module-note" style="margin:12px 0">Saved on this browser. The start page is used when you open the workspace; the row count applies when you open Masterlist.</p>
        <div class="page-head-actions"><button class="btn btn-primary" type="submit">Save Preferences</button><button class="btn btn-secondary" type="button" id="settings-reset">Restore Defaults</button></div>
      </form>
    </div>
  </div>
</section>
