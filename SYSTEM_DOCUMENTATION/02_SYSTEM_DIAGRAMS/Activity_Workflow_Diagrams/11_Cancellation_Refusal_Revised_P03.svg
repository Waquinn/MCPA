<?xml version="1.0" encoding="UTF-8" standalone="yes"?><svg xmlns="http://www.w3.org/2000/svg" width="1500" height="2180" viewBox="0 0 1500 2180" role="img" aria-labelledby="title desc"><title id="title">Controlled cancellation and refusal — page 3</title><desc id="desc">Cancel, withdraw or reopen field records. Only original field sender can reopen. Canceling transfer also permits the eligible requester of its linked released request.</desc><defs><marker id="arrow" markerWidth="13" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 11 5 L 0 10 Z" fill="#203e53"/></marker></defs><rect width="1500" height="2180" fill="white"/><g font-family="Arial, sans-serif"><text x="65" y="48" font-size="22" fill="#526578">SITETRACE / MCPA</text><text x="65" y="98" font-size="40" fill="#153952">Controlled cancellation and refusal</text><text x="65" y="142" font-size="27" fill="#526578">3 / 4  ·  Cancel, withdraw or reopen field records</text><text x="65" y="2050" font-size="23" fill="#41556a">Only original field sender can reopen. Canceling transfer also permits the eligible requester of its linked released</text><text x="65" y="2079" font-size="23" fill="#41556a">request.</text><text x="65" y="2160" font-size="19" fill="#526578">Source-reviewed 071ae16 · 20 Oct 2026 · Main flow ↓ / branches → · Paired circles: same page / pentagons: named page</text><line x1="65" x2="1435" y1="163" y2="163" stroke="#ced8df" stroke-width="2"/><polyline data-edge="p3e1" points="550,354 550,407" fill="none" stroke="#203e53" stroke-width="3" marker-end="url(#arrow)"/><polyline data-edge="p3e2" points="550,527 550,580" fill="none" stroke="#203e53" stroke-width="3" marker-end="url(#arrow)"/><polyline data-edge="p3e3" points="920,710 1035,710" fill="none" stroke="#203e53" stroke-width="3" marker-end="url(#arrow)"/><text x="977.5" y="696" font-size="26" font-weight="600" fill="#203e53" text-anchor="middle">No</text><polyline data-edge="p3e4" points="1240,780.4100000000001 1240,833.4100000000001" fill="none" stroke="#203e53" stroke-width="3" marker-end="url(#arrow)"/><polyline data-edge="p3e5" points="550,840 550,893" fill="none" stroke="#203e53" stroke-width="3" marker-end="url(#arrow)"/><text x="580" y="873.5" font-size="26" font-weight="600" fill="#203e53" text-anchor="start">Yes</text><polyline data-edge="p3e6" points="550,1081.4 550,1134.4" fill="none" stroke="#203e53" stroke-width="3" marker-end="url(#arrow)"/><polyline data-edge="p3e7" points="920,1264.4 1035,1264.4" fill="none" stroke="#203e53" stroke-width="3" marker-end="url(#arrow)"/><text x="977.5" y="1250.4" font-size="26" font-weight="600" fill="#203e53" text-anchor="middle">No</text><polyline data-edge="p3e8" points="1240,1334.81 1240,1387.81" fill="none" stroke="#203e53" stroke-width="3" marker-end="url(#arrow)"/><polyline data-edge="p3e9" points="550,1394.4 550,1447.4" fill="none" stroke="#203e53" stroke-width="3" marker-end="url(#arrow)"/><text x="580" y="1427.9" font-size="26" font-weight="600" fill="#203e53" text-anchor="start">Yes</text><polyline data-edge="p3e10" points="550,1599.2 550,1652.2" fill="none" stroke="#203e53" stroke-width="3" marker-end="url(#arrow)"/><g data-shape="p3n1"><polygon points="220,190 880,190 880,312 550,354 220,312" stroke="#203e53" stroke-width="3" fill="#edf2f7"/><text data-node="p3n1" text-anchor="middle" fill="#162e40" font-size="28" font-weight="400"><tspan x="550" y="240.92000000000002" dominant-baseline="central">B · From page 1</tspan><tspan x="550" y="275.08000000000004" dominant-baseline="central">Permitted field action</tspan></text></g><g data-shape="p3n2"><rect x="170" y="407" width="760" height="120" stroke="#203e53" stroke-width="3" fill="#ffffff"/><text data-node="p3n2" text-anchor="middle" fill="#162e40" font-size="30" font-weight="400"><tspan x="550" y="448.7" dominant-baseline="central">Validate original actor, record state</tspan><tspan x="550" y="485.3" dominant-baseline="central">and action-specific ownership again.</tspan></text></g><g data-shape="p3n3"><polygon points="550,580 920,710 550,840 180,710" stroke="#203e53" stroke-width="3" fill="#fff7e5"/><text data-node="p3n3" text-anchor="middle" fill="#162e40" font-size="28" font-weight="600"><tspan x="550" y="710" dominant-baseline="central">Action remains allowed?</tspan></text></g><g data-shape="p3n4"><polygon points="1071,639.59 1445,639.59 1409,780.4100000000001 1035,780.4100000000001" stroke="#203e53" stroke-width="3" fill="#ffffff"/><text data-node="p3n4" text-anchor="middle" fill="#162e40" font-size="27" font-weight="400"><tspan x="1240" y="677.06" dominant-baseline="central">Show permission,</tspan><tspan x="1240" y="710" dominant-baseline="central">validation or conflict</tspan><tspan x="1240" y="742.9399999999999" dominant-baseline="central">message to the user.</tspan></text></g><g data-shape="p3n5"><ellipse cx="1240" cy="883.4100000000001" rx="205" ry="50" stroke="#203e53" stroke-width="3" fill="#ffffff"/><text data-node="p3n5" text-anchor="middle" fill="#162e40" font-size="27" font-weight="600"><tspan x="1240" y="883.4100000000001" dominant-baseline="central">End · No change saved</tspan></text></g><g data-shape="p3n6"><rect x="170" y="893" width="760" height="188.4" stroke="#203e53" stroke-width="3" fill="#ffffff"/><text data-node="p3n6" text-anchor="middle" fill="#162e40" font-size="30" font-weight="400"><tspan x="550" y="932.3000000000001" dominant-baseline="central">Apply selected action atomically:</tspan><tspan x="550" y="968.9000000000001" dominant-baseline="central">withdraw Pending request; cancel Approved</tspan><tspan x="550" y="1005.5000000000001" dominant-baseline="central">reservation or Pending / Refused transfer;</tspan><tspan x="550" y="1042.1000000000001" dominant-baseline="central">or reopen Refused transfer to Pending.</tspan></text></g><g data-shape="p3n7"><polygon points="550,1134.4 920,1264.4 550,1394.4 180,1264.4" stroke="#203e53" stroke-width="3" fill="#fff7e5"/><text data-node="p3n7" text-anchor="middle" fill="#162e40" font-size="28" font-weight="600"><tspan x="550" y="1264.4" dominant-baseline="central">Action committed?</tspan></text></g><g data-shape="p3n8"><polygon points="1071,1193.99 1445,1193.99 1409,1334.81 1035,1334.81" stroke="#203e53" stroke-width="3" fill="#ffffff"/><text data-node="p3n8" text-anchor="middle" fill="#162e40" font-size="27" font-weight="400"><tspan x="1240" y="1231.46" dominant-baseline="central">Show conflict / error;</tspan><tspan x="1240" y="1264.4" dominant-baseline="central">reload record state</tspan><tspan x="1240" y="1297.3400000000001" dominant-baseline="central">and allowedActions.</tspan></text></g><g data-shape="p3n9"><ellipse cx="1240" cy="1437.81" rx="205" ry="50" stroke="#203e53" stroke-width="3" fill="#ffffff"/><text data-node="p3n9" text-anchor="middle" fill="#162e40" font-size="27" font-weight="600"><tspan x="1240" y="1437.81" dominant-baseline="central">End · No change saved</tspan></text></g><g data-shape="p3n10"><polygon points="206,1447.4 930,1447.4 894,1599.2 170,1599.2" stroke="#203e53" stroke-width="3" fill="#ffffff"/><text data-node="p3n10" text-anchor="middle" fill="#162e40" font-size="30" font-weight="400"><tspan x="550" y="1486.7000000000003" dominant-baseline="central">Display new state. Cancellation frees</tspan><tspan x="550" y="1523.3000000000002" dominant-baseline="central">reservations; linked request is canceled</tspan><tspan x="550" y="1559.9000000000003" dominant-baseline="central">with transfer. Reopen keeps audit evidence.</tspan></text></g><g data-shape="p3n11"><ellipse cx="550" cy="1702.2" rx="340" ry="50" stroke="#203e53" stroke-width="3" fill="#ffffff"/><text data-node="p3n11" text-anchor="middle" fill="#162e40" font-size="30" font-weight="600"><tspan x="550" y="1702.2" dominant-baseline="central">End · Field interruption saved</tspan></text></g></g></svg>