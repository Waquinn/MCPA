<?xml version="1.0" encoding="UTF-8" standalone="yes"?><svg xmlns="http://www.w3.org/2000/svg" width="1500" height="2180" viewBox="0 0 1500 2180" role="img" aria-labelledby="title desc"><title id="title">Equipment request and approval — page 3</title><desc id="desc">Required rejection reason. Rejecting a Pending request creates no inventory reservation and changes no custody.</desc><defs><marker id="arrow" markerWidth="13" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 11 5 L 0 10 Z" fill="#203e53"/></marker></defs><rect width="1500" height="2180" fill="white"/><g font-family="Arial, sans-serif"><text x="65" y="48" font-size="22" fill="#526578">SITETRACE / MCPA</text><text x="65" y="98" font-size="40" fill="#153952">Equipment request and approval</text><text x="65" y="142" font-size="27" fill="#526578">3 / 3  ·  Required rejection reason</text><text x="65" y="2050" font-size="23" fill="#41556a">Rejecting a Pending request creates no inventory reservation and changes no custody.</text><text x="65" y="2160" font-size="19" fill="#526578">Source-reviewed 071ae16 · 20 Oct 2026 · Main flow ↓ / branches → · Paired circles: same page / pentagons: named page</text><line x1="65" x2="1435" y1="163" y2="163" stroke="#ced8df" stroke-width="2"/><polyline data-edge="p3e1" points="550,354 550,407" fill="none" stroke="#203e53" stroke-width="3" marker-end="url(#arrow)"/><polyline data-edge="p3e2" points="550,527 550,580" fill="none" stroke="#203e53" stroke-width="3" marker-end="url(#arrow)"/><polyline data-edge="p3e3" points="920,710 1035,710" fill="none" stroke="#203e53" stroke-width="3" marker-end="url(#arrow)"/><text x="977.5" y="696" font-size="26" font-weight="600" fill="#203e53" text-anchor="middle">No</text><polyline data-edge="p3e4" points="1240,780.4100000000001 1240,833.4100000000001" fill="none" stroke="#203e53" stroke-width="3" marker-end="url(#arrow)"/><polyline data-edge="p3e5" points="550,840 550,893" fill="none" stroke