ne points="495,689 495,724" stroke="#526b7c" stroke-width="1.7" fill="none"  marker-end="url(#arrow)"/><polyline points="495,834 495,869" stroke="#526b7c" stroke-width="1.7" fill="none"  marker-end="url(#arrow)"/><text x="488" y="860" text-anchor="middle" font-family="Arial" font-size="14" fill="#364f61" style="paint-order:stroke;stroke:white;stroke-width:6;stroke-linejoin:round">Yes</text><polyline points="495,945 495,980" stroke="#526b7c" stroke-width="1.7" fill="none"  marker-end="url(#arrow)"/><polyline points="755,523 875,523" stroke="#526b7c" stroke-width="1.7" fill="none"  marker-end="url(#arrow)"/><text x="815" y="513" text-anchor="middle" font-family="Arial" font-size="14" fill="#364f61" style="paint-order:stroke;stroke:white;stroke-width:6;stroke-linejoin:round">No</text><polyline points="755,779 875,779" stroke="#526b7c" stroke-width="1.7" fill="none"  marker-end="url(#arrow)"/><text x="815" y="769" text-anchor="middle" font-family="Arial" font-size="14" fill="#364f61" style="paint-order:stroke;stroke:white;stroke-width:6;stroke-linejoin:round">No</text><polyline points="1240,779 1260,779 1260,1018 755,1018" stroke="#526b7c" stroke-width="1.7" fill="none"  marker-end="url(#arrow)"/><ellipse cx="495" cy="173" rx="260" ry="38" fill="#f7f9fb" stroke="#607d90" stroke-width="3"/><text x="495" y="167.15" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#203344">Admin/Secretary: choose consumable</text><text x="495" y="191.45000000000002" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#203344">One open purchase request per item</text><rect x="235" y="246" width="520" height="76" rx="10" fill="#f7f9fb" stroke="#607d90" stroke-width="1.6" /><text x="495" y="278.15000000000003" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#203344">DB: save Pending material request</text><text x="495" y="302.45000000000005" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#203344">Purpose/decimal/date checks; stock unchanged</text><rect x="235" y="357" width="520" height="76" rx="10" fill="#f7f9fb" stroke="#607d90" stroke-width="1.6" /><text x="495" y="389.15000000000003" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#203344">Admin/Secretary: enter physical receipt</text><text x="495" y="413.45000000000005" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#203344">quantity and evidence note</text><polygon points="495,468 755,523 495,578 235,523" fill="#fff4d9" stroke="#607d90" stroke-width="1.8"/><text x="495" y="517.15" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#203344">Version/operation/outstanding</text><text x="495" y="541.4499999999999" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#203344">quantity valid?</text><rect x="235" y="613" width="520" height="76" rx="10" fill="#f7f9fb" stroke="#607d90" stroke-width="1.6" /><text x="495" y="645.15" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#203344">DB: increment stock + receipt history</text><text x="495" y="669.4499999999999" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#203344">Request → Partial or Received</text><polygon points="495,724 755,779 495,834 235,779" fill="#fff4d9" stroke="#607d90" stroke-width="1.8"/><text x="495" y="785.3" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#203344">Outstanding remainder canceled?</text><rect x="235" y="869" width="520" height="76" rx="10" fill="#f7f9fb" stroke="#607d90" stroke-width="1.6" /><text x="495" y="901.15" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#203344">DB: save reason; preserve received stock</text><text x="495" y="925.4499999999999" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#203344">Request → Cancelled if balance remains</text><ellipse cx="495" cy="1018" rx="260" ry="38" fill="#f7f9fb" stroke="#607d90" stroke-width="3"/><text x="495" y="1012.15" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#203344">Separate Purchases ledger: record supplier,</text><text x="495" y="1036.45" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#203344">reference, prices and optional receipt file</text><rect x="875" y="480" width="365" height="86" rx="10" fill="#fff6ed" stroke="#607d90" stroke-width="1.6" /><text x="1057.5" y="517.475" text-anchor="middle" font-family="Arial" font-size="17" font-weight="400" fill="#203344">Reject overreceipt/stale retry; refresh</text><text x="1057.5" y="540.4250000000001" text-anchor="middle" font-family="Arial" font-size="17" font-weight="400" fill="#203344">existing request and Stock History</text><rect x="875" y="736" width="365" height="86" rx="10" fill="#fff6ed" stroke="#607d90" stroke-width="1.6" /><text x="1057.5" y="773.475" text-anchor="middle" font-family="Arial" font-size="17" font-weight="400" fill="#203344">No cancellation: remain Partial</text><text x="1057.5" y="796.4250000000001" text-anchor="middle" font-family="Arial" font-size="17" font-weight="400" fill="#203344">or fully Received</text><text x="45" y="1153" font-family="Arial" font-size="15" fill="#536978">Purchases ledger is separate: saving it never increments stock. Material requests have no approval stage.</text><text x="45" y="1176" font-family="Arial" font-size="15" fill="#536978">Non-cancellation path proceeds to optional independent ledger recording; no ledger entry is required to receive stock.</text><line x1="40" y1="1204" x2="1250" y2="1204" stroke="#cbd5dd"/><text x="45" y="1225" font-family="Arial" font-size="13" fill="#536978">SiteTrace / MCPA · 20 October 2026 · Source verified; deployed behavior NEEDS VERIFICATION</text></svg></body></html>
