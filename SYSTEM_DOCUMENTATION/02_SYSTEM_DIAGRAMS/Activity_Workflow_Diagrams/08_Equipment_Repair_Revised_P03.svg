<?xml version="1.0" encoding="UTF-8" standalone="yes"?><svg xmlns="http://www.w3.org/2000/svg" width="1500" height="2180" viewBox="0 0 1500 2180" role="img" aria-labelledby="title desc"><title id="title">Equipment repair — page 3</title><desc id="desc">Admin completion. Start and completion are separate validated, idempotent actions. A refresh failure after commit does not undo completion.</desc><defs><marker id="arrow" markerWidth="13" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 11 5 L 0 10 Z" fill="#203e53"/></marker></defs><rect width="1500" height="2180" fill="white"/><g font-family="Arial, sans-serif"><text x="65" y="48" font-size="22" fill="#526578">SITETRACE / MCPA</text><text x="65" y="98" font-size="40" fill="#153952">Equipment repair</text><text x="65" y="142" font-size="27" fill="#526578">3 / 3  ·  Admin completion</text><text x="65" y="2050" font-size="23" fill="#41556a">Start and completion are separate validated, idempotent actions. A refresh failure after commit does not undo</text><text x="65" y="2079" font-size="23" fill="#41556a">completion.</text><text x="65" y="2160" font-size="19" fill="#526578">Source-reviewed 071ae16 · 20 Oct 2026 · Main flow ↓ / branches → · Paired circles: same page / pentagons: named page</text><line x1="65" x2="1435" y1="163" y2="163" stroke="#ced8df" stroke-width="2"/><polyline data-edge="p3e1" points="550,354 550,407" fill="none" stroke="#203e53" stroke-width="3" marker-end="url(#arrow)"/><polyline data-edge="p3e2" points="550,527 550,580" fill="none" stroke="#203e53" stroke-width="3" marker-end="url(#arrow)"/><polyline data-edge="p3e3" points="920,710 1035,710" fill="none" stroke="#203e53" stroke-width="3" marker-end="url(#arrow)"/><text x="977.5" y="696" font-size="26" font-weight="600" fill="#203e53" text-anchor="middle">No</text><polyline data-edge="p3e4" points="1240,780.4100000000001 1240,833.4100000000001" fill="none" stroke="#203e53" stroke-width="3" marker-end="url(#arrow)"/><polyline data-edge="p3e5" points="550,840 550,893" fill="none" stroke="#203e53" stroke-width="3" marker-end="url(#arrow)"/><text x="580" y="873.5" font-size="26" font-weight="600" fill="#203e53" text-anchor="start">Yes</text><polyline data-edge="p3e6" points="550,1044.8 550,1097.8" fill="none" stroke="#203e53" stroke-width="3" marker-end="url(#arrow)"/><polyline data-edge="p3e7" points="920,1227.8 1035,1227.8" fill="none" stroke="#203e53" stroke-width="3" marker-end="url(#arrow)"/><text x="977.5" y="1213.8" font-size="26" font-weight="600" fill="#203e53" text-anchor="middle">No</text><polyline data-edge="p3e8" points="1240,1298.2099999999998 1240,1351.2099999999998" fill="none" stroke="#203e53" stroke-width="3" marker-end="url(#arrow)"/><polyline data-edge="p3e9" points="550,1357.8 550,1410.8" fill="none" stroke="#203e53" stroke-width="3" marker-end="url(#arrow)"/><text x="580" y="1391.3" font-size="26" font-weight="600" fill="#203e53" text-anchor="start">Yes</text><polyline data-edge="p3e10" points="550,1530.8 550,1583.8" fill="none" stroke="#203e53" stroke-width="3" marker-end="url(#arrow)"/><polyline data-edge="p3e11" points="920,1713.8 1035,1713.8" fill="none" stroke="#203e53" stroke-width="3" marker-end="url(#arrow)"/><text x="977.5" y="1699.8" font-size="26" font-weight="600" fill="#203e53" text-anchor="middle">No</text><polyline data-edge="p3e12" points="1240,1784.2099999999998 1240,1837.2099999999998" fill="none" stroke="#203e53" stroke-width="3" marker-end="url(#arrow)"/><polyline data-edge="p3e13" points="550,1843.8 550,1896.8" fill="none" stroke="#203e53" stroke-width="3" marker-end="url(#arrow)"/><text x="580" y="1877.3" font-size="26" font-weight="600" fill="#203e53" text-anchor="start">Yes</text><g data-shape="p3n1"><polygon points="220,190 880,190 880,312 550,354 220,312" stroke="#203e53" stroke-width="3" fill="#edf2f7"/><text data-node="p3n1" text-anchor="middle" fill="#162e40" font-size="28" font-weight="400"><tspan x="550" y="240.92000000000002" dominant-baseline="central">B · From page 2</tspan><tspan x="550" y="275.08000000000004" dominant-baseline="central">Under repair case</tspan></text></g><g data-shape="p3n2"><polygon points="206,407 930,407 894,527 170,527" stroke="#203e53" stroke-width="3" fill="#ffffff"/><text data-node="p3n2" text-anchor="middle" fill="#162e40" font-size="30" font-weight="400"><tspan x="550" y="448.7" dominant-baseline="central">After the work, Admin confirms</tspan><tspan x="550" y="485.3" dominant-baseline="central">completion and the recorded destination.</tspan></text></g><g data-shape="p3n3"><polygon points="550,580 920,710 550,840 180,710" stroke="#203e53" stroke-width="3" fill="#fff7e5"/><text data-node="p3n3" text-anchor="middle" fill="#162e40" font-size="28" font-weight="600"><tspan x="550" y="692.92" dominant-baseline="central">Admin and Under repair</tspan><tspan x="550" y="727.0799999999999" dominant-baseline="central">case still valid?</tspan></text></g><g data-shape="p3n4"><polygon points="1071,639.59 1445,639.59 1409,780.4100000000001 1035,780.4100000000001" stroke="#203e53" stroke-width="3" fill="#ffffff"/><text data-node="p3n4" text-anchor="middle" fill="#162e40" font-size="27" font-weight="400"><tspan x="1240" y="677.06" dominant-baseline="central">Show permission,</tspan><tspan x="1240" y="710" dominant-baseline="central">validation or conflict</tspan><tspan x="1240" y="742.9399999999999" dominant-baseline="central">message to the user.</tspan></text></g><g data-shape="p3n5"><ellipse cx="1240" cy="883.4100000000001" rx="205" ry="50" stroke="#203e53" stroke-width="3" fill="#ffffff"/><text data-node="p3n5" text-anchor="middle" fill="#162e40" font-size="27" font-weight="600"><tspan x="1240" y="883.4100000000001" dominant-baseline="central">End · No change saved</tspan></text></g><g data-shape="p3n6"><rect x="170" y="893" width="760" height="151.8" stroke="#203e53" stroke-width="3" fill="#ffffff"/><text data-node="p3n6" text-anchor="middle" fill="#162e40" font-size="30" font-weight="400"><tspan x="550" y="932.3" dominant-baseline="central">Atomically complete the case, clear</tspan><tspan x="550" y="968.9" dominant-baseline="central">personal holder and set equipment</tspan><tspan x="550" y="1005.5" dominant-baseline="central">AVAILABLE at the recorded destination.</tspan></text></g><g data-shape="p3n7"><polygon points="550,1097.8 920,1227.8 550,1357.8 180,1227.8" stroke="#203e53" stroke-width="3" fill="#fff7e5"/><text data-node="p3n7" text-anchor="middle" fill="#162e40" font-size="28" font-weight="600"><tspan x="550" y="1227.8" dominant-baseline="central">Completion committed?</tspan></text></g><g data-shape="p3n8"><polygon points="1071,1157.3899999999999 1445,1157.3899999999999 1409,1298.2099999999998 1035,1298.2099999999998" stroke="#203e53" stroke-width="3" fill="#ffffff"/><text data-node="p3n8" text-anchor="middle" fill="#162e40" font-size="27" font-weight="400"><tspan x="1240" y="1194.86" dominant-baseline="central">Show failure / conflict;</tspan><tspan x="1240" y="1227.8" dominant-baseline="central">reload case before</tspan><tspan x="1240" y="1260.7399999999998" dominant-baseline="central">retrying operation.</tspan></text></g><g data-shape="p3n9"><ellipse cx="1240" cy="1401.2099999999998" rx="205" ry="50" stroke="#203e53" stroke-width="3" fill="#ffffff"/><text data-node="p3n9" text-anchor="middle" fill="#162e40" font-size="27" font-weight="600"><tspan x="1240" y="1401.2099999999998" dominant-baseline="central">End · Not completed</tspan></text></g><g data-shape="p3n10"><rect x="170" y="1410.8" width="760" height="120" stroke="#203e53" stroke-width="3" fill="#ffffff"/><text data-node="p3n10" text-anchor="middle" fill="#162e40" font-size="30" font-weight="400"><tspan x="550" y="1470.8" dominant-baseline="central">Refresh movement records.</tspan></text></g><g data-shape="p3n11"><polygon points="550,1583.8 920,1713.8 550,1843.8 180,1713.8" stroke="#203e53" stroke-width="3" fill="#fff7e5"/><text data-node="p3n11" text-anchor="middle" fill="#162e40" font-size="28" font-weight="600"><tspan x="550" y="1713.8" dominant-baseline="central">Records refreshed?</tspan></text></g><g data-shape="p3n12"><polygon points="1071,1643.3899999999999 1445,1643.3899999999999 1409,1784.2099999999998 1035,1784.2099999999998" stroke="#203e53" stroke-width="3" fill="#ffffff"/><text data-node="p3n12" text-anchor="middle" fill="#162e40" font-size="27" font-weight="400"><tspan x="1240" y="1680.86" dominant-baseline="central">Show saved-success</tspan><tspan x="1240" y="1713.8" dominant-baseline="central">warning. Block new</tspan><tspan x="1240" y="1746.7399999999998" dominant-baseline="central">changes until reload.</tspan></text></g><g data-shape="p3n13"><ellipse cx="1240" cy="1887.2099999999998" rx="205" ry="50" stroke="#203e53" stroke-width="3" fill="#ffffff"/><text data-node="p3n13" text-anchor="middle" fill="#162e40" font-size="27" font-weight="600"><tspan x="1240" y="1870.7399999999998" dominant-baseline="central">End · Saved; reload</tspan><tspan x="1240" y="1903.6799999999998" dominant-baseline="central">needed</tspan></text></g><g data-shape="p3n14"><ellipse cx="550" cy="1946.8" rx="340" ry="50" stroke="#203e53" stroke-width="3" fill="#ffffff"/><text data-node="p3n14" text-anchor="middle" fill="#162e40" font-size="30" font-weight="600"><tspan x="550" y="1946.8" dominant-baseline="central">End · Repair completed</tspan></text></g></g></svg>