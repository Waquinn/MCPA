<?xml version="1.0" encoding="UTF-8" standalone="yes"?><svg xmlns="http://www.w3.org/2000/svg" width="1500" height="2180" viewBox="0 0 1500 2180" role="img" aria-labelledby="title desc"><title id="title">Password recovery and account setup — page 2</title><desc id="desc">Recovery or invitation password setup. Account access still depends on an active supported company profile. A password change does not activate a disabled profile.</desc><defs><marker id="arrow" markerWidth="13" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 11 5 L 0 10 Z" fill="#203e53"/></marker></defs><rect width="1500" height="2180" fill="white"/><g font-family="Arial, sans-serif"><text x="65" y="48" font-size="22" fill="#526578">SITETRACE / MCPA</text><text x="65" y="98" font-size="40" fill="#153952">Password recovery and account setup</text><text x="65" y="142" font-size="27" fill="#526578">2 / 2  ·  Recovery or invitation password setup</text><text x="65" y="2050" font-size="23" fill="#41556a">Account access still depends on an active supported company profile. A password change does not activate a disabled</text><text x="65" y="2079" font-size="23" fill="#41556a">profile.</text><text x="65" y="2160" font-size="19" fill="#526578">Source-reviewed 071ae16 · 20 Oct 2026 · Main flow ↓ / branches → · Paired circles: same page / pentagons: named page</text><line x1="65" x2="1435" y1="163" y2="163" stroke="#ced8df" stroke-width="2"/><polyline data-edge="p2e1" points="550,356.48 550,409.48" fill="none" stroke="#203e53" stroke-width="3" marker-end="url(#arrow)"/><polyline data-edge="p2e2" points="550,529.48 550,582.48" fill="none" stroke="#203e53" stroke-width="3" marker-end="url(#arrow)"/><polyline data-edge="p2e3" points="920,712.48 1035,712.48" fill="none" stroke="#203e53" stroke-width="3" marker-end="url(#arrow)"/><text x="977.5" y="698.48" font-size="26" font-weight="600" fill="#203e53" text-anchor="middle">No</text><polyline data-edge="p2e4" points="1240,782.8900000000001 1240,835.8900000000001" fill="none" stroke="#203e53" stroke-width="3" marker-end="url(#arrow)"/><polyline data-edge="p2e5" points="550,842.48 550,895.48" fill="none" stroke="#203e53" stroke-width="3" marker-end="url(#arrow)"/><text x="580" y="875.98" font-size="26" font-weight="600" fill="#203e53" text-anchor="start">Yes</text><polyline data-edge="p2e6" points="550,1015.48 550,1068.48" fill="none" stroke="#203e53" stroke-width="3" marker-end="url(#arrow)"/><polyline data-edge="p2e7" points="550,1220.28 550,1273.28" fill="none" stroke="#203e53" stroke-width="3" marker-end="url(#arrow)"/><polyline data-edge="p2e8" points="920,1403.28 1035,1403.28" fill="none" stroke="#203e53" stroke-width="3" marker-end="url(#arrow)"/><text x="977.5" y="1389.28" font-size="26" font-weight="600" fill="#203e53" text-anchor="middle">No</text><polyline data-edge="p2e9" points="1240,1473.6899999999998 1240,1526.6899999999998" fill="none" stroke="#203e53" stroke-width="3" marker-end="url(#arrow)"/><polyline data-edge="p2e10" points="550,1533.28 550,1586.28" fill="none" stroke="#203e53" stroke-width="3" marker-end="url(#arrow)"/><text x="580" y="1566.78" font-size="26" font-weight="600" fill="#203e53" text-anchor="start">Yes</text><polyline data-edge="p2e11" points="550,1706.28 550,1759.28" fill="none" stroke="#203e53" stroke-width="3" marker-end="url(#arrow)"/><g data-shape="p2n1"><polygon points="220,190 880,190 880,314.48 550,356.48 220,314.48" stroke="#203e53" stroke-width="3" fill="#edf2f7"/><text data-node="p2n1" text-anchor="middle" fill="#162e40" font-size="28" font-weight="400"><tspan x="550" y="225.08" dominant-baseline="central">A · From page 1</tspan><tspan x="550" y="259.24" dominant-baseline="central">Email callback; invitations also enter</tspan><tspan x="550" y="293.4" dominant-baseline="central">here</tspan></text></g><g data-shape="p2n2"><rect x="170" y="409.48" width="760" height="120" stroke="#203e53" stroke-width="3" fill="#ffffff"/><text data-node="p2n2" text-anchor="middle" fill="#162e40" font-size="30" font-weight="400"><tspan x="550" y="451.18" dominant-baseline="central">Handle recovery / invite callback</tspan><tspan x="550" y="487.78000000000003" dominant-baseline="central">before ordinary session restoration.</tspan></text></g><g data-shape="p2n3"><polygon points="550,582.48 920,712.48 550,842.48 180,712.48" stroke="#203e53" stroke-width="3" fill="#fff7e5"/><text data-node="p2n3" text-anchor="middle" fill="#162e40" font-size="28" font-weight="600"><tspan x="550" y="695.4" dominant-baseline="central">Valid Auth session</tspan><tspan x="550" y="729.56" dominant-baseline="central">for password setup?</tspan></text></g><g data-shape="p2n4"><polygon points="1071,642.07 1445,642.07 1409,782.8900000000001 1035,782.8900000000001" stroke="#203e53" stroke-width="3" fill="#ffffff"/><text data-node="p2n4" text-anchor="middle" fill="#162e40" font-size="27" font-weight="400"><tspan x="1240" y="679.54" dominant-baseline="central">Show expired / invalid</tspan><tspan x="1240" y="712.48" dominant-baseline="central">link message; request</tspan><tspan x="1240" y="745.42" dominant-baseline="central">a new reset or invite.</tspan></text></g><g data-shape="p2n5"><ellipse cx="1240" cy="885.8900000000001" rx="205" ry="50" stroke="#203e53" stroke-width="3" fill="#ffffff"/><text data-node="p2n5" text-anchor="middle" fill="#162e40" font-size="27" font-weight="600"><tspan x="1240" y="885.8900000000001" dominant-baseline="central">End · Setup unavailable</tspan></text></g><g data-shape="p2n6"><polygon points="206,895.48 930,895.48 894,1015.48 170,1015.48" stroke="#203e53" stroke-width="3" fill="#ffffff"/><text data-node="p2n6" text-anchor="middle" fill="#162e40" font-size="30" font-weight="400"><tspan x="550" y="937.1800000000001" dominant-baseline="central">Enter a new password</tspan><tspan x="550" y="973.7800000000001" dominant-baseline="central">of at least 12 characters.</tspan></text></g><g data-shape="p2n7"><rect x="170" y="1068.48" width="760" height="151.8" stroke="#203e53" stroke-width="3" fill="#ffffff"/><text data-node="p2n7" text-anchor="middle" fill="#162e40" font-size="30" font-weight="400"><tspan x="550" y="1107.7800000000002" dominant-baseline="central">Validate the form; call updateUser</tspan><tspan x="550" y="1144.38" dominant-baseline="central">with the new password; preserve form</tspan><tspan x="550" y="1180.9800000000002" dominant-baseline="central">and show error if update fails.</tspan></text></g><g data-shape="p2n8"><polygon points="550,1273.28 920,1403.28 550,1533.28 180,1403.28" stroke="#203e53" stroke-width="3" fill="#fff7e5"/><text data-node="p2n8" text-anchor="middle" fill="#162e40" font-size="28" font-weight="600"><tspan x="550" y="1403.28" dominant-baseline="central">Password saved?</tspan></text></g><g data-shape="p2n9"><polygon points="1071,1332.87 1445,1332.87 1409,1473.6899999999998 1035,1473.6899999999998" stroke="#203e53" stroke-width="3" fill="#ffffff"/><text data-node="p2n9" text-anchor="middle" fill="#162e40" font-size="27" font-weight="400"><tspan x="1240" y="1370.34" dominant-baseline="central">Show validation / Auth</tspan><tspan x="1240" y="1403.28" dominant-baseline="central">error; keep setup form</tspan><tspan x="1240" y="1436.2199999999998" dominant-baseline="central">for a corrected retry.</tspan></text></g><g data-shape="p2n10"><ellipse cx="1240" cy="1576.6899999999998" rx="205" ry="50" stroke="#203e53" stroke-width="3" fill="#ffffff"/><text data-node="p2n10" text-anchor="middle" fill="#162e40" font-size="27" font-weight="600"><tspan x="1240" y="1576.6899999999998" dominant-baseline="central">End · Password not saved</tspan></text></g><g data-shape="p2n11"><rect x="170" y="1586.28" width="760" height="120" stroke="#203e53" stroke-width="3" fill="#ffffff"/><text data-node="p2n11" text-anchor="middle" fill="#162e40" font-size="30" font-weight="400"><tspan x="550" y="1627.98" dominant-baseline="central">Sign out and show saved confirmation</tspan><tspan x="550" y="1664.58" dominant-baseline="central">on login; user signs in again.</tspan></text></g><g data-shape="p2n12"><ellipse cx="550" cy="1809.28" rx="340" ry="50" stroke="#203e53" stroke-width="3" fill="#ffffff"/><text data-node="p2n12" text-anchor="middle" fill="#162e40" font-size="30" font-weight="600"><tspan x="550" y="1809.28" dominant-baseline="central">End · Password setup complete</tspan></text></g></g></svg>