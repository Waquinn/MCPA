ver and</tspan><tspan x="550" y="663.0799999999999" dominant-baseline="central">reservations valid?</tspan></text></g><g data-shape="p1n4"><polygon points="1071,575.59 1445,575.59 1409,716.4100000000001 1035,716.4100000000001" stroke="#203e53" stroke-width="3" fill="#ffffff"/><text data-node="p1n4" text-anchor="middle" fill="#162e40" font-size="27" font-weight="400"><tspan x="1240" y="613.06" dominant-baseline="central">Show permission,</tspan><tspan x="1240" y="646" dominant-baseline="central">validation or conflict</tspan><tspan x="1240" y="678.9399999999999" dominant-baseline="central">message to the user.</tspan></text></g><g data-shape="p1n5"><ellipse cx="1240" cy="819.4100000000001" rx="205" ry="50" stroke="#203e53" stroke-width="3" fill="#ffffff"/><text data-node="p1n5" text-anchor="middle" fill="#162e40" font-size="27" font-weight="600"><tspan x="1240" y="819.4100000000001" dominant-baseline="central">End · No change saved</tspan></text></g><g data-shape="p1n6"><rect x="170" y="829" width="760" height="151.8" stroke="#203e53" stroke-width="3" fill="#ffffff"/><text data-node="p1n6" text-anchor="middle" fill="#162e40" font-size="30" font-weight="400"><tspan x="550" y="868.3" dominant-baseline="central">Atomically create Pending transfer with</tspan><tspan x="550" y="904.9" dominant-baseline="central">source snapshots; rebind reservations</tspan><tspan x="550" y="941.5" dominant-baseline="central">to it and mark request Released.</tspan></text></g><g data-shape="p1n7"><polygon points="550,1033.8 920,1163.8 550,1293.8 180,1163.8" stroke="#203e53" stroke-width="3" fill="#fff7e5"/><text data-node="p1n7" text-anchor="middle" fill="#162e40" font-size="28" font-weight="600"><tspan x="550" y="1163.8" dominant-baseline="central">Release committed?</tspan></text></g><g data-shape="p1n8"><polygon points="1071,1093.3899999999999 1445,1093.3899999999999 1409,1234.2099999999998 1035,1234.2099999999998" stroke="#203e53" stroke-width="3" fill="#ffffff"/><text data-node="p1n8"