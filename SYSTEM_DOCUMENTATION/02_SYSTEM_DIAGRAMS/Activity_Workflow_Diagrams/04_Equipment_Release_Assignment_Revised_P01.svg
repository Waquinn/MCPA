<?xml version="1.0" encoding="UTF-8" standalone="yes"?><svg xmlns="http://www.w3.org/2000/svg" width="1500" height="2180" viewBox="0 0 1500 2180" role="img" aria-labelledby="title desc"><title id="title">Equipment release and assignment — page 1</title><desc id="desc">Approved request to pending handover. The release operation is atomic and idempotent. An approved request alone is not evidence of a physical handover.</desc><defs><marker id="arrow" markerWidth="13" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 11 5 L 0 10 Z" fill="#203e53"/></marker></defs><rect width="1500" height="2180" fill="white"/><g font-family="Arial, sans-serif"><text x="65" y="48" font-size="22" fill="#526578">SITETRACE / MCPA</text><text x="65" y="98" font-size="40" fill="#153952">Equipment release and assignment</text><text x="65" y="142" font-size="27" fill="#526578">1 / 2  ·  Approved request to pending handover</text><text x="65" y="2050" font-size="23" fill="#41556a">The release operation is atomic and idempotent. An approved request alone is not evidence of a physical handover.</text><text x="65" y="2160" font-size="19" fill="#526578">Source-reviewed 071ae16 · 20 Oct 2026 · Main flow ↓ / branches → · Paired circles: same page / pentagons: named page</text><line x1="65" x2="1435" y1="163" y2="163" stroke="#ced8df" stroke-width="2"/><polyline data-edge="p1e1" points="550,290 550,343" fill="none" stroke="#203e53" stroke-width="3" marker-end="url(#arrow)"/><polyline data-edge="p1e2" points="550,463 550,516" fill="none" stroke="#203e53" stroke-width="3" marker-end="url(#arrow)"/><polyline data-edge="p1e3" points="920,646 1035,646" fill="none" stroke="#203e53" stroke-width="3" marker-end="url(#arrow)"/><text x="977.5" y="632" font-size="26" font-weight="600" fill="#203e53" text-anchor="middle">No</text><polyline data-edge="p1e4" points="1240,716.4100000000001 1240,769.4100000000001" fill="none" stroke="#203e53" stroke-width="3" marker-end="