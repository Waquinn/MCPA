ta-node="p2n7" text-anchor="middle" fill="#162e40" font-size="27" font-weight="400"><tspan x="1240" y="1042.94" dominant-baseline="central">B · To page 3</tspan><tspan x="1240" y="1075.88" dominant-baseline="central">Record rejection reason</tspan></text></g><g data-shape="p2n8"><rect x="170" y="1256.41" width="760" height="151.8" stroke="#203e53" stroke-width="3" fill="#ffffff"/><text data-node="p2n8" text-anchor="middle" fill="#162e40" font-size="30" font-weight="400"><tspan x="550" y="1295.7100000000003" dominant-baseline="central">Revalidate availability and competing</tspan><tspan x="550" y="1332.3100000000002" dominant-baseline="central">locks; atomically reserve every item</tspan><tspan x="550" y="1368.9100000000003" dominant-baseline="central">and save Approved, or roll back.</tspan></text></g><g data-shape="p2n9"><polygon points="550,1461.21 920,1591.21 550,1721.21 180,1591.21" stroke="#203e53" stroke-width="3" fill="#fff7e5"/><text data-node="p2n9" text-anchor="middle" fill="#162e40" font-size="28" font-weight="600"><tspan x="550" y="1591.21" dominant-baseline="central">Approval committed?</tspan></text></g><g data-shape="p2n10"><polygon points="1071,1520.8 1445,1520.8 1409,1661.62 1035,1661.62" stroke="#203e53" stroke-width="3" fill="#ffffff"/><text data-node="p2n10" text-anchor="middle" fill="#162e40" font-size="27" font-weight="400"><tspan x="1240" y="1558.27" dominant-baseline="central">Show conflict / error;</tspan><tspan x="1240" y="1591.21" dominant-baseline="central">refresh the request</tspan><tspan x="1240" y="1624.15" dominant-baseline="central">and inventory.</tspan></text></g><g data-shape="p2n11"><ellipse cx="1240" cy="1764.62" rx="205" ry="50" stroke="#203e53" stroke-width="3" fill="#ffffff"/><text data-node="p2n11" text-anchor="middle" fill="#162e40" font-size="27" font-weight="600"><tspan x="1240" y="1764.62" dominant-baseline="central">End · No approval saved</tspan></text></g><g data-shape="p2n12"><ellipse cx="550" cy="1824.21" rx="340" 