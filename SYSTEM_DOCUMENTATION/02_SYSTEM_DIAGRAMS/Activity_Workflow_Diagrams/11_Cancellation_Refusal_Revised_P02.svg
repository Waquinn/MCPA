<?xml version="1.0" encoding="UTF-8" standalone="yes"?><svg xmlns="http://www.w3.org/2000/svg" width="1500" height="2180" viewBox="0 0 1500 2180" role="img" aria-labelledby="title desc"><title id="title">Controlled cancellation and refusal — page 2</title><desc id="desc">Named receiver refuses the entire transfer. Refusal is not partial receipt and does not transfer custody. Initial request releases are subject to the receiver-owned rules.</desc><defs><marker id="arrow" markerWidth="13" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 11 5 L 0 10 Z" fill="#203e53"/></marker></defs><rect width="1500" height="2180" fill="white"/><g font-family="Arial, sans-serif"><text x="65" y="48" font-size="22" fill="#526578">SITETRACE / MCPA</text><text x="65" y="98" font-size="40" fill="#153952">Controlled cancellation and refusal</text><text x="65" y="142" font-size="27" fill="#526578">2 / 4  ·  Named receiver refuses the entire transfer</text><text x="65" y="2050" font-size="23" fill="#41556a">Refusal is not partial receipt and does not transfer custody. Initial request releases are subject to the</text><text x="65" y="2079" font-size="23" fill="#41556a">receiver-owned rules.</text><text x="65" y="2160" font-size="19" fill="#526578">Source-reviewed 071ae16 · 20 Oct 2026 · Main flow ↓ / branches → · Paired circles: same page / pentagons: named page</text><line x1="65" x2="1435" y1="163" y2="163" stroke="#ced8df" stroke-width="2"/><polyline data-edge="p2e1" points="550,354 550,407" fill="none" stroke="#203e53" stroke-width="3" marker-end="url(#arrow)"/><polyline data-edge="p2e2" points="550,558.8 550,611.8" fill="none" stroke="#203e53" stroke-width="3" marker-end="url(#arrow)"/><polyline data-edge="p2e3" points="920,741.8 1035,741.8" fill="none" stroke="#203e53" stroke-width="3" marker-end="url(#arrow)"/><text x="977.5" y="727.8" font-size="26" font-weight="600" fill="#203e53" text-anchor="middle">No</text><polyline data-edge="p2e4" points="1240,812.21 1240,865.21" fill="none" stroke="#203e53" stroke-width="3" marker-end="url(#arrow)"/><polyline data-edge="p2e5" points="550,871.8 550,924.8" fill="none" stroke="#203e53" stroke-width="3" marker-end="url(#arrow)"/><text x="580" y="905.3" font-size="26" font-weight="600" fill="#203e53" text-anchor="start">Yes</text><polyline data-edge="p2e6" points="550,1076.6 550,1129.6" fill="none" stroke="#203e53" stroke-width="3" marker-end="url(#arrow)"/><polyline data-edge="p2e7" points="920,1259.6 1035,1259.6" fill="none" stroke="#203e53" stroke-width="3" marker-end="url(#arrow)"/><text x="977.5" y="1245.6" font-size="26" font-weight="600" fill="#203e53" text-anchor="middle">No</text><polyline data-edge="p2e8" points="1240,1330.0099999999998 1240,1383.0099999999998" fill="none" stroke="#203e53" stroke-width="3" marker-end="url(#arrow)"/><polyline data-edge="p2e9" points="550,1389.6 550,1442.6" fill="none" stroke="#203e53" stroke-width="3" marker-end="url(#arrow)"/><text x="580" y="1423.1" font-size="26" font-weight="600" fill="#203e53" text-anchor="start">Yes</text><polyline data-edge="p2e10" points="550,1594.3999999999999 550,1647.3999999999999" fill="none" stroke="#203e53" stroke-width="3" marker-end="url(#arrow)"/><g data-shape="p2n1"><polygon points="220,190 880,190 880,312 550,354 220,312" stroke="#203e53" stroke-width="3" fill="#edf2f7"/><text data-node="p2n1" text-anchor="middle" fill="#162e40" font-size="28" font-weight="400"><tspan x="550" y="240.92000000000002" dominant-baseline="central">A · From page 1</tspan><tspan x="550" y="275.08000000000004" dominant-baseline="central">Named receiver refusal</tspan></text></g><g data-shape="p2n2"><polygon points="206,407 930,407 894,558.8 170,558.8" stroke="#203e53" stroke-width="3" fill="#ffffff"/><text data-node="p2n2" text-anchor="middle" fill="#162e40" font-size="30" font-weight="400"><tspan x="550" y="446.29999999999995" dominant-baseline="central">Inspect every tool; decline custody</tspan><tspan x="550" y="482.9" dominant-baseline="central">for at least one Damaged tool.</tspan><tspan x="550" y="519.5" dominant-baseline="central">Confirm refusal; enter reason and notes.</tspan></text></g><g data-shape="p2n3"><polygon points="550,611.8 920,741.8 550,871.8 180,741.8" stroke="#203e53" stroke-width="3" fill="#fff7e5"/><text data-node="p2n3" text-anchor="middle" fill="#162e40" font-size="28" font-weight="600"><tspan x="550" y="724.7199999999999" dominant-baseline="central">Receiver, inspection and</tspan><tspan x="550" y="758.8799999999999" dominant-baseline="central">Pending state valid?</tspan></text></g><g data-shape="p2n4"><polygon points="1071,671.39 1445,671.39 1409,812.21 1035,812.21" stroke="#203e53" stroke-width="3" fill="#ffffff"/><text data-node="p2n4" text-anchor="middle" fill="#162e40" font-size="27" font-weight="400"><tspan x="1240" y="708.8599999999999" dominant-baseline="central">Show permission,</tspan><tspan x="1240" y="741.8" dominant-baseline="central">validation or conflict</tspan><tspan x="1240" y="774.7399999999999" dominant-baseline="central">message to the user.</tspan></text></g><g data-shape="p2n5"><ellipse cx="1240" cy="915.21" rx="205" ry="50" stroke="#203e53" stroke-width="3" fill="#ffffff"/><text data-node="p2n5" text-anchor="middle" fill="#162e40" font-size="27" font-weight="600"><tspan x="1240" y="915.21" dominant-baseline="central">End · No change saved</tspan></text></g><g data-shape="p2n6"><rect x="170" y="924.8" width="760" height="151.8" stroke="#203e53" stroke-width="3" fill="#ffffff"/><text data-node="p2n6" text-anchor="middle" fill="#162e40" font-size="30" font-weight="400"><tspan x="550" y="964.0999999999999" dominant-baseline="central">Atomically save Refused transfer</tspan><tspan x="550" y="1000.6999999999999" dominant-baseline="central">and immutable refusal evidence.</tspan><tspan x="550" y="1037.3" dominant-baseline="central">Retain custody, status and reservations.</tspan></text></g><g data-shape="p2n7"><polygon points="550,1129.6 920,1259.6 550,1389.6 180,1259.6" stroke="#203e53" stroke-width="3" fill="#fff7e5"/><text data-node="p2n7" text-anchor="middle" fill="#162e40" font-size="28" font-weight="600"><tspan x="550" y="1259.6" dominant-baseline="central">Refusal committed?</tspan></text></g><g data-shape="p2n8"><polygon points="1071,1189.1899999999998 1445,1189.1899999999998 1409,1330.0099999999998 1035,1330.0099999999998" stroke="#203e53" stroke-width="3" fill="#ffffff"/><text data-node="p2n8" text-anchor="middle" fill="#162e40" font-size="27" font-weight="400"><tspan x="1240" y="1226.6599999999999" dominant-baseline="central">Show failure / conflict;</tspan><tspan x="1240" y="1259.6" dominant-baseline="central">reload the handover</tspan><tspan x="1240" y="1292.54" dominant-baseline="central">before retry.</tspan></text></g><g data-shape="p2n9"><ellipse cx="1240" cy="1433.0099999999998" rx="205" ry="50" stroke="#203e53" stroke-width="3" fill="#ffffff"/><text data-node="p2n9" text-anchor="middle" fill="#162e40" font-size="27" font-weight="600"><tspan x="1240" y="1433.0099999999998" dominant-baseline="central">End · No refusal saved</tspan></text></g><g data-shape="p2n10"><polygon points="206,1442.6 930,1442.6 894,1594.3999999999999 170,1594.3999999999999" stroke="#203e53" stroke-width="3" fill="#ffffff"/><text data-node="p2n10" text-anchor="middle" fill="#162e40" font-size="30" font-weight="400"><tspan x="550" y="1481.9" dominant-baseline="central">Display Refused status. Original field</tspan><tspan x="550" y="1518.5" dominant-baseline="central">sender may reopen; eligible originator</tspan><tspan x="550" y="1555.1000000000001" dominant-baseline="central">may cancel using allowedActions.</tspan></text></g><g data-shape="p2n11"><ellipse cx="550" cy="1697.3999999999999" rx="340" ry="50" stroke="#203e53" stroke-width="3" fill="#ffffff"/><text data-node="p2n11" text-anchor="middle" fill="#162e40" font-size="30" font-weight="600"><tspan x="550" y="1697.3999999999999" dominant-baseline="central">End · Entire handover refused</tspan></text></g></g></svg>