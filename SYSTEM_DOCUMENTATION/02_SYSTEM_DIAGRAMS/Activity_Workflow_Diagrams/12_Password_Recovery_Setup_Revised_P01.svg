 x="550" y="646" dominant-baseline="central">Email format valid?</tspan></text></g><g data-shape="p1n4"><polygon points="1071,575.59 1445,575.59 1409,716.4100000000001 1035,716.4100000000001" stroke="#203e53" stroke-width="3" fill="#ffffff"/><text data-node="p1n4" text-anchor="middle" fill="#162e40" font-size="27" font-weight="400"><tspan x="1240" y="613.06" dominant-baseline="central">Show field validity</tspan><tspan x="1240" y="646" dominant-baseline="central">message; correct</tspan><tspan x="1240" y="678.9399999999999" dominant-baseline="central">the email address.</tspan></text></g><g data-shape="p1n5"><ellipse cx="1240" cy="819.4100000000001" rx="205" ry="50" stroke="#203e53" stroke-width="3" fill="#ffffff"/><text data-node="p1n5" text-anchor="middle" fill="#162e40" font-size="27" font-weight="600"><tspan x="1240" y="819.4100000000001" dominant-baseline="central">End · Email required</tspan></text></g><g data-shape="p1n6"><rect x="170" y="829" width="760" height="120" stroke="#203e53" stroke-width="3" fill="#ffffff"/><text data-node="p1n6" text-anchor="middle" fill="#162e40" font-size="30" font-weight="400"><tspan x="550" y="870.7" dominant-baseline="central">Call Supabase password-reset email</tspan><tspan x="550" y="907.3000000000001" dominant-baseline="central">with the application callback URL.</tspan></text></g><g data-shape="p1n7"><polygon points="550,1002 920,1132 550,1262 180,1132" stroke="#203e53" stroke-width="3" fill="#fff7e5"/><text data-node="p1n7" text-anchor="middle" fill="#162e40" font-size="28" font-weight="600"><tspan x="550" y="1132" dominant-baseline="central">Request accepted?</tspan></text></g><g data-shape="p1n8"><polygon points="1071,1072 1445,1072 1409,1192 1035,1192" stroke="#203e53" stroke-width="3" fill="#ffffff"/><text data-node="p1n8" text-anchor="middle" fill="#162e40" font-size="27" font-weight="400"><tspan x="1240" y="1115.53" dominant-baseline="central">Show connection error;</tspan><tspan x="1240" y="1148.47" dominant-baseline="central">retain email for retry.</tspan></text></g><g data-shape="p1n9"><ellipse cx="1240" cy="1295" rx="205" ry="50" stroke="#203e53" stroke-width="3" fill="#ffffff"/><text data-node="p1n9" text-anchor="middle" fill="#162e40" font-size="27" font-weight="600"><tspan x="1240" y="1278.53" dominant-baseline="central">End · Reset request</tspan><tspan x="1240" y="1311.47" dominant-baseline="central">failed</tspan></text></g><g data-shape="p1n10"><polygon points="206,1315 930,1315 894,1435 170,1435" stroke="#203e53" stroke-width="3" fill="#ffffff"/><text data-node="p1n10" text-anchor="middle" fill="#162e40" font-size="30" font-weight="400"><tspan x="550" y="1356.7" dominant-baseline="central">Show generic message: if the account</tspan><tspan x="550" y="1393.3" dominant-baseline="central">exists, a reset email will be sent.</tspan></text></g><g data-shape="p1n11"><polygon points="220,1488 880,1488 880,1610 550,1652 220,1610" stroke="#203e53" stroke-width="3" fill="#edf2f7"/><text data-node="p1n11" text-anchor="middle" fill="#162e40" font-size="28" font-weight="400"><tspan x="550" y="1538.92" dominant-baseline="central">A · To page 2</tspan><tspan x="550" y="1573.0800000000002" dominant-baseline="central">User opens the emailed link</tspan></text></g></g></svg>