<svg xmlns="http://www.w3.org/2000/svg" width="1290" height="1241" viewBox="0 0 1290 1241"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#526b7c"/></marker><marker id="many" viewBox="0 0 16 16" refX="15" refY="8" markerWidth="12" markerHeight="12" orient="auto"><path d="M1 8L15 1M1 8L15 8M1 8L15 15" fill="none" stroke="#526b7c" stroke-width="1.4"/></marker><marker id="one" viewBox="0 0 14 14" refX="2" refY="7" markerWidth="10" markerHeight="10" orient="auto"><path d="M5 1V13M9 1V13" fill="none" stroke="#526b7c" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="32" y="31" width="7" height="53" fill="#ac8435"/><text x="55" y="55" font-family="Arial" font-size="29" font-weight="700" fill="#153952">Office return and inspected receiving</text><text x="55" y="83" font-family="Arial" font-size="16" fill="#536978">Actor is shown in each activity · decisions rechecked server-side · one asset record moves as a whole</text><polyline points="495,211 495,246" stroke="#526b7c" stroke-width="1.7" fill="none"  marker-end="url(#arrow)"/><polyline points="495,322 495,357" stroke="#526b7c" stroke-width="1.7" fill="none"  marker-end="url(#arrow)"/><polyline points="495,467 495,502" stroke="#526b7c" stroke-width="1.7" fill="none"  marker-end="url(#arrow)"/><text x="488" y="493" text-anchor="middle" font-family="Arial" font-size="14" fill="#364f61" style="paint-order:stroke;stroke:white;stroke-width:6;stroke-linejoin:round">Yes</text><polyline points="495,578 495,613" stroke="#526b7c" stroke-width="1.7" fill="none"  marker-end="url(#arrow)"/><polyline points="495,689 495,724" stroke="#526b7c" stroke-width="1.7" fill="none"  marker-end="url(#arrow)"/><polyline points="495,834 495,869" stroke="#526b7c" stroke-width="1.7" fill="none"  marker-end="url(#arrow)"/><text x="488" y="860" text-anchor="middle" font-family="Arial" font-size="14" fill="#364f61" style="paint-order:stroke;stroke:white;stroke-width:6;stroke-linejoin:round">Yes</text><polyline points="495,945 495,980" stroke="#526b7c" stroke-width="1.7" fill="none"  marker-end="url(#arrow)"/><polyline points="755,412 875,412" stroke="#526b7c" stroke-width="1.7" fill="none"  marker-end="url(#arrow)"/><text x="815" y="402" text-anchor="middle" font-family="Arial" font-size="14" fill="#364f61" style="paint-order:stroke;stroke:white;stroke-width:6;stroke-linejoin:round">No</text><polyline points="755,779 875,779" stroke="#526b7c" stroke-width="1.7" fill="none"  marker-end="url(#arrow)"/><text x="815" y="769" text-anchor="middle" font-family="Arial" font-size="14" fill="#364f61" style="paint-order:stroke;stroke:white;stroke-width:6;stroke-linejoin:round">Missing</text><polyline points="1240,779 1260,779 1260,1018 755,1018" stroke="#526b7c" stroke-width="1.7" fill="none"  marker-end="url(#arrow)"/><ellipse cx="495" cy="173" rx="260" ry="38" fill="#f7f9fb" stroke="#607d90" stroke-width="3"/><text x="495" y="179.3" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#203344">Engineer/Architect holder: open Return</text><rect x="235" y="246" width="520" height="76" rx="10" fill="#f7f9fb" stroke="#607d90" stroke-width="1.6" /><text x="495" y="278.15000000000003" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#203344">Browser: read pinned active Office</text><text x="495" y="302.45000000000005" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#203344">Select eligible held In Use whole records</text><polygon points="495,357 755,412 495,467 235,412" fill="#fff4d9" stroke="#607d90" stroke-width="1.8"/><text x="495" y="418.3" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#203344">Office and custody/state validation pass?</text><rect x="235" y="502" width="520" height="76" rx="10" fill="#f7f9fb" stroke="#607d90" stroke-width="1.6" /><text x="495" y="534.15" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#203344">Holder: record one condition per tool</text><text x="495" y="558.4499999999999" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#203344">Notes required for damaged/missing</text><rect x="235" y="613" width="520" height="76" rx="10" fill="#f7f9fb" stroke="#607d90" stroke-width="1.6" /><text x="495" y="645.15" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#203344">DB: finalize inspected return atomically</text><text x="495" y="669.4499999999999" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#203344">No separate Admin receiving/QR stage</text><polygon points="495,724 755,779 495,834 235,779" fill="#fff4d9" stroke="#607d90" stroke-width="1.8"/><text x="495" y="785.3" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#203344">Condition is Good or Damaged?</text><rect x="235" y="869" width="520" height="76" rx="10" fill="#f7f9fb" stroke="#607d90" stroke-width="1.6" /><text x="495" y="901.15" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#203344">Good → Office / AVAILABLE / no holder</text><text x="495" y="925.4499999999999" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#203344">Damaged → Office / REPAIR / no holder + case</text><ellipse cx="495" cy="1018" rx="260" ry="38" fill="#f7f9fb" stroke="#607d90" stroke-width="3"/><text x="495" y="1012.15" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#203344">DB: save return/activity/notices</text><text x="495" y="1036.45" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#203344">Browser refreshes current custody</text><rect x="875" y="369" width="365" height="86" rx="10" fill="#fff6ed" stroke="#607d90" stroke-width="1.6" /><text x="1057.5" y="406.47499999999997" text-anchor="middle" font-family="Arial" font-size="17" font-weight="400" fill="#203344">Keep draft; retry Office read or ask</text><text x="1057.5" y="429.42499999999995" text-anchor="middle" font-family="Arial" font-size="17" font-weight="400" fill="#203344">Admin; reject arbitrary destination</text><rect x="875" y="736" width="365" height="86" rx="10" fill="#fff6ed" stroke="#607d90" stroke-width="1.6" /><text x="1057.5" y="773.475" text-anchor="middle" font-family="Arial" font-size="17" font-weight="400" fill="#203344">Missing → MISSING + loss case</text><text x="1057.5" y="796.4250000000001" text-anchor="middle" font-family="Arial" font-size="17" font-weight="400" fill="#203344">Retain last holder and site</text><text x="45" y="1153" font-family="Arial" font-size="15" fill="#536978">Good/damaged branches represent physically returned records; Office wrapper clears damaged-return holder.</text><text x="45" y="1176" font-family="Arial" font-size="15" fill="#536978">Missing records do not physically arrive at Office. All outcome branches commit within the same return transaction.</text><line x1="40" y1="1204" x2="1250" y2="1204" stroke="#cbd5dd"/><text x="45" y="1225" font-family="Arial" font-size="13" fill="#536978">SiteTrace / MCPA · 20 October 2026 · Source verified; deployed behavior NEEDS VERIFICATION</text></svg>