<?xml version="1.0" encoding="UTF-8" standalone="yes"?><svg xmlns="http://www.w3.org/2000/svg" width="1500" height="2180" viewBox="0 0 1500 2180" role="img" aria-labelledby="title desc"><title id="title">Equipment registration — page 2</title><desc id="desc">Optional private photograph. B joins the no-photo path with the completed-photo path. Office validation occurs before any photo preparation.</desc><defs><marker id="arrow" markerWidth="13" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 11 5 L 0 10 Z" fill="#203e53"/></marker></defs><rect width="1500" height="2180" fill="white"/><g font-family="Arial, sans-serif"><text x="65" y="48" font-size="22" fill="#526578">SITETRACE / MCPA</text><text x="65" y="98" font-size="40" fill="#153952">Equipment registration</text><text x="65" y="142" font-size="27" fill="#526578">2 / 3  ·  Optional private photograph</text><text x="65" y="2050" font-size="23" fill="#41556a">B joins the no-photo path with the completed-photo path. Office validation occurs before any photo preparation.</text><text x="65" y="2160" font-size="19" fill="#526578">Source-reviewed 071ae16 · 20 Oct 2026 · Main flow ↓ / branches → · Paired circles: same page / pentagons: named page</text><line x1="65" x2="1435" y1="163" y2="163" stroke="#ced8df" stroke-width="2"/><polyline data-edge="p2e1" points="550,354 550,407" fill="none" stroke="#203e53" stroke-width="3" marker-end="url(#arrow)"/><polyline data-edge="p2e2" points="920,537 1198,537" fill="none" stroke="#203e53" stroke-width="3" marker-end="url(#arrow)"/><text x="1059" y="523" font-size="26" font-weight="600" fill="#203e53" text-anchor="middle">No</text><polyline data-edge="p2e3" points="550,667 550,720" fill="none" stroke="#203e53" stroke-width="3" marker-end="url(#arrow)"/><text x="580" y="700.5" font-size="26" font-weight="600" fill="#203e53" text-anchor="start">Yes</text><polyline data-edge="p2e4" points="550,871.8 550,924.8" fill="none" stroke="#203e