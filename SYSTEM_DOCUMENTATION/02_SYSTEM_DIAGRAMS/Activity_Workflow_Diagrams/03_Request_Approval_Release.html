90" stroke-width="1.6" /><text x="495" y="423.15000000000003" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#203344">DB: save Pending request + activity</text><text x="495" y="447.45000000000005" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#203344">No reservation or custody change</text><polygon points="495,502 755,557 495,612 235,557" fill="#fff4d9" stroke="#607d90" stroke-width="1.8"/><text x="495" y="563.3" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#203344">Admin: approve eligible pending request?</text><rect x="235" y="647" width="520" height="76" rx="10" fill="#f7f9fb" stroke="#607d90" stroke-width="1.6" /><text x="495" y="679.15" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#203344">DB: recheck/lock assets; reserve each record</text><text x="495" y="703.4499999999999" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#203344">Request → Approved; custody unchanged</text><rect x="235" y="758" width="520" height="76" rx="10" fill="#f7f9fb" stroke="#607d90" stroke-width="1.6" /><text x="495" y="790.15" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#203344">Admin: release reserved request</text><text x="495" y="814.4499999999999" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#203344">Active named receiver must remain valid</text><rect x="235" y="869" width="520" height="76" rx="10" fill="#f7f9fb" stroke="#607d90" stroke-width="1.6" /><text x="495" y="901.15" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#203344">DB: create Pending linked handover</text><text x="495" y="925.4499999999999" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#203344">Request → Released; transfer reservation</text><ellipse cx="495" cy="1018" rx="260" ry="38" fill="#f7f9fb" stroke="#607d90
