<svg xmlns="http://www.w3.org/2000/svg" width="1290" height="1241" viewBox="0 0 1290 1241"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#526b7c"/></marker><marker id="many" viewBox="0 0 16 16" refX="15" refY="8" markerWidth="12" markerHeight="12" orient="auto"><path d="M1 8L15 1M1 8L15 8M1 8L15 15" fill="none" stroke="#526b7c" stroke-width="1.4"/></marker><marker id="one" viewBox="0 0 14 14" refX="2" refY="7" markerWidth="10" markerHeight="10" orient="auto"><path d="M5 1V13M9 1V13" fill="none" stroke="#526b7c" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="32" y="31" width="7" height="53" fill="#ac8435"/><text x="55" y="55" font-family="Arial" font-size="29" font-weight="700" fill="#153952">QR transfer and named-receiver confirmation</text><text x="55" y="83" font-family="Arial" font-size="16" fill="#536978">Actor is shown in each activity · decisions rechecked server-side · one asset record moves as a whole</text><polyline points="495,211 495,246" stroke="#526b7c" stroke-width="1.7" fill="none"  marker-end="url(#arrow)"/><polyline points="495,322 495,357" stroke="#526b7c" stroke-width="1.7" fill="none"  marker-end="url(#arrow)"/><polyline points="495,467 495,502" stroke="#526b7c" stroke-width="1.7" fill="none"  marker-end="url(#arrow)"/><text x="488" y="493" text-anchor="middle" font-family="Arial" font-size="14" fill="#364f61" style="paint-order:stroke;stroke:white;stroke-width:6;stroke-linejoin:round">Yes</text><polyline points="495,578 495,613" stroke="#526b7c" stroke-width="1.7" fill="none"  marker-end="url(#arrow)"/><polyline points="495,689 495,724" stroke="#526b7c" stroke-width="1.7" fill="none"  marker-end="url(#arrow)"/><polyline points="495,834 495,869" stroke="#526b7c" stroke-width="1.7" fill="none"  marker-end="url(#arrow)"/><text x="488" y="860" text-anchor="middle" font-family="Arial" font-size="14" fill="#364f61" style="paint-order:stroke;stroke:white;stroke-width:6;stroke-linejoin:round">Yes</text><polyline points="495,945 495,980" stroke="#526b7c" stroke-width="1.7" fill="none"  marker-end="url(#arrow)"/><polyline points="755,412 875,412" stroke="#526b7c" stroke-width="1.7" fill="none"  marker-end="url(#arrow)"/><text x="815" y="402" text-anchor="middle" font-family="Arial" font-size="14" fill="#364f61" style="paint-order:stroke;stroke:white;stroke-width:6;stroke-linejoin:round">No</text><polyline points="755,779 875,779" stroke="#526b7c" stroke-width="1.7" fill="none"  marker-end="url(#arrow)"/><text x="815" y="769" text-anchor="middle" font-family="Arial" font-size="14" fill="#364f61" style="paint-order:stroke;stroke:white;stroke-width:6;stroke-linejoin:round">No</text><ellipse cx="495" cy="173" rx="260" ry="38" fill="#f7f9fb" stroke="#607d90" stroke-width="3"/><text x="495" y="167.15" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#203344">Sender: held In Use tools; or Tool Handler</text><text x="495" y="191.45000000000002" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#203344">selects eligible unheld Available stock</text><rect x="235" y="246" width="520" height="76" rx="10" fill="#f7f9fb" stroke="#607d90" stroke-width="1.6" /><text x="495" y="278.15000000000003" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#203344">Receiver context: scan temporary receiving QR</text><text x="495" y="302.45000000000005" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#203344">or select receiver and assigned project manually</text><polygon points="495,357 755,412 495,467 235,412" fill="#fff4d9" stroke="#607d90" stroke-width="1.8"/><text x="495" y="406.15000000000003" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#203344">DB: active receiver/project; optional token</text><text x="495" y="430.45000000000005" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#203344">valid, unexpired and assignment matches?</text><rect x="235" y="502" width="520" height="76" rx="10" fill="#f7f9fb" stroke="#607d90" stroke-width="1.6" /><text x="495" y="534.15" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#203344">DB: save Pending transfer and reservation</text><text x="495" y="558.4499999999999" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#203344">Handover QR/code identifies saved transfer</text><rect x="235" y="613" width="520" height="76" rx="10" fill="#f7f9fb" stroke="#607d90" stroke-width="1.6" /><text x="495" y="645.15" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#203344">Named receiver: look up code / scan handover</text><text x="495" y="669.4499999999999" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#203344">Inspect each whole record; test received tools</text><polygon points="495,724 755,779 495,834 235,779" fill="#fff4d9" stroke="#607d90" stroke-width="1.8"/><text x="495" y="773.15" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#203344">Every condition/test/note/custody</text><text x="495" y="797.4499999999999" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#203344">decision valid and receipt authorized?</text><rect x="235" y="869" width="520" height="76" rx="10" fill="#f7f9fb" stroke="#607d90" stroke-width="1.6" /><text x="495" y="901.15" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#203344">DB: good/accepted damage → receiver/site</text><text x="495" y="925.4499999999999" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#203344">Missing → retain source holder/site + case</text><ellipse cx="495" cy="1018" rx="260" ry="38" fill="#f7f9fb" stroke="#607d90" stroke-width="3"/><text x="495" y="1012.15" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#203344">DB: Received; release reservation</text><text x="495" y="1036.45" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#203344">Update linked request; activity + notices</text><rect x="875" y="369" width="365" height="86" rx="10" fill="#fff6ed" stroke="#607d90" stroke-width="1.6" /><text x="1057.5" y="406.47499999999997" text-anchor="middle" font-family="Arial" font-size="17" font-weight="400" fill="#203344">Reject invalid context; refresh assignment</text><text x="1057.5" y="429.42499999999995" text-anchor="middle" font-family="Arial" font-size="17" font-weight="400" fill="#203344">or obtain fresh receiver QR</text><rect x="875" y="736" width="365" height="86" rx="10" fill="#fff6ed" stroke="#607d90" stroke-width="1.6" /><text x="1057.5" y="773.475" text-anchor="middle" font-family="Arial" font-size="17" font-weight="400" fill="#203344">Incomplete → correct truthful inspection</text><text x="1057.5" y="796.4250000000001" text-anchor="middle" font-family="Arial" font-size="17" font-weight="400" fill="#203344">Eligible damage refusal* → Refused</text><text x="45" y="1153" font-family="Arial" font-size="15" fill="#536978">Receiving QR expires in 15 minutes; token hash stored privately; resolving a QR does not transfer custody.</text><text x="45" y="1176" font-family="Arial" font-size="15" fill="#536978">* Refused handover keeps equipment/custody and reservation; eligible original field sender reopens/cancels.</text><line x1="40" y1="1204" x2="1250" y2="1204" stroke="#cbd5dd"/><text x="45" y="1225" font-family="Arial" font-size="13" fill="#536978">SiteTrace / MCPA · 20 October 2026 · Source verified; deployed behavior NEEDS VERIFICATION</text></svg>