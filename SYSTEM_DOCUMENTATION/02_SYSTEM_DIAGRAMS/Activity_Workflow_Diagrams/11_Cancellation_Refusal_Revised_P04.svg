<?xml version="1.0" encoding="UTF-8" standalone="yes"?><svg xmlns="http://www.w3.org/2000/svg" width="1500" height="2180" viewBox="0 0 1500 2180" role="img" aria-labelledby="title desc"><title id="title">Controlled cancellation and refusal — page 4</title><desc id="desc">Cancel outstanding consumables procurement. This is a separate consumables action with Admin / Secretary authority, independent of optional field movement cancellation.</desc><defs><marker id="arrow" markerWidth="13" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 11 5 L 0 10 Z" fill="#203e53"/></marker></defs><rect width="1500" height="2180" fill="white"/><g font-family="Arial, sans-serif"><text x="65" y="48" font-size="22" fill="#526578">SITETRACE / MCPA</text><text x="65" y="98" font-size="40" fill="#153952">Controlled cancellation and refusal</text><text x="65" y="142" font-size="27" fill="#526578">4 / 4  ·  Cancel outstanding consumables procurement</text><text x="65" y="2050" font-size="23" fill="#41556a">This is a separate consumables action with Admin / Secretary authority, independent of optional field movement</text><text x="65" y="2079" font-size="23" fill="#41556a">cancellation.</text><text x="65" y="2160" font-size="19" fill="#526578">Source-reviewed 071ae16 · 20 Oct 2026 · Main flow ↓ / branches → · Paired circles: same page / pentagons: named page</text><line x1="65" x2="1435" y1="163" y2="163" stroke="#ced8df" stroke-width="2"/><polyline data-edge="p4e1" points="550,290 550,343" fill="none" stroke="#203e53" stroke-width="3" marker-end="url(#arrow)"/><polyline data-edge="p4e2" points="550,494.8 550,547.8" fill="none" stroke="#203e53" stroke-width="3" marker-end="url(#arrow)"/><polyline data-edge="p4e3" points="920,677.8 1035,677.8" fill="none" stroke="#203e53" stroke-width="3" marker-end="url(#arrow)"/><text x="977.5" y="663.8" font-size="26" font-weight="600" fill="#203e53" text-anchor="middle">No</text><polyline data-edge="p4e4" point