<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="2100" height="2970" viewBox="0 0 2100 2970" role="img" aria-labelledby="title"><title id="title">Main Admin Flowchart - page 4: Verified company logout and retry</title><defs><marker id="arrow" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#292929"/></marker></defs><rect width="2100" height="2970" fill="white"/><g font-family="Arial, sans-serif" fill="#222"><text x="60" y="48" font-size="23">SITETRACE / MCPA  |  STAGE 1</text><text x="60" y="102" font-size="44">Main Admin System Flowchart</text><text x="60" y="151" font-size="31">Page 4 of 4 - Verified company logout and retry</text><text x="60" y="2860" font-size="26">Logout clears the local UI and navigation before Supabase confirms sign-out. A retries unconfirmed sign-out. The call uses</text><text x="60" y="2892" font-size="26">scope: local; this diagram makes no claim about other devices.</text><text x="60" y="2944" font-size="23">Source-reviewed 071ae16 | 20 October 2026 | White symbols / dark outlines | A3 portrait</text><polyline data-edge="P4E1" points="650,340 650,388" fill="none" stroke="#292929" stroke-width="3" marker-end="url(#arrow)"/><polyline data-edge="P4E2" points="650,472 650,520" fill="none" stroke="#292929" stroke-width="3" marker-end="url(#arrow)"/><polyline data-edge="P4E3" points="650,684.4 650,732.4" fill="none" stroke="#292929" stroke-width="3" marker-end="url(#arrow)"/><polyline data-edge="P4E4" points="650,852.4 650,900.4" fill="none" stroke="#292929" stroke-width="3" marker-end="url(#arrow)"/><polyline data-edge="P4E5" points="1170,1030.4 1410,1030.4" fill="none" stroke="#292929" stroke-width="3" marker-end="url(#arrow)"/><text font-size="30" font-weight="600" text-anchor="middle"><tspan x="1290" y="1012.4000000000001">No</tspan></text><polyline data-edge="P4E6" points="1730,1105.4 1730,1153.4" fill="none" stroke="#292929" stroke-width="3" marker-end="url(#arrow)"/><polyline data-edge="P4E7" points="650,1160.4 650,1208.4" fill="none" stroke="#292929" stroke-width="3" marker-end="url(#arrow)"/><text font-size="30" font-weight="600" text-anchor="start"><tspan x="684" y="1191.4">Yes</tspan></text><polyline data-edge="P4E8" points="650,1332 650,1380" fill="none" stroke="#292929" stroke-width="3" marker-end="url(#arrow)"/><g data-shape="P4N1"><polygon points="170,190 1130,190 1130,304 650,340 170,304" fill="white" stroke="#292929" stroke-width="3"/><text data-node="P4N1" text-anchor="middle" font-size="31" font-weight="400"><tspan x="650" y="231.4" dominant-baseline="central">L - From page 2</tspan><tspan x="650" y="268.6" dominant-baseline="central">Admin selects Log Out</tspan></text></g><g data-shape="P4N2"><circle cx="650" cy="430" r="42" fill="white" stroke="#292929" stroke-width="3"/><text data-node="P4N2" text-anchor="middle" font-size="34" font-weight="600"><tspan x="650" y="430" dominant-baseline="central">A</tspan></text></g><g data-shape="P4N3"><rect x="130" y="520" width="1040" height="164.39999999999998" fill="white" stroke="#292929" stroke-width="3"/><text data-node="P4N3" text-anchor="middle" font-size="34" font-weight="400"><tspan x="650" y="561.4000000000001" dominant-baseline="central">End the navigation session; clear local</tspan><tspan x="650" y="602.2" dominant-baseline="central">profile, workspace and setup/demo markers.</tspan><tspan x="650" y="643.0000000000001" dominant-baseline="central">Remove the route hash; show Signing out.</tspan></text></g><g data-shape="P4N4"><rect x="130" y="732.4" width="1040" height="120" fill="white" stroke="#292929" stroke-width="3"/><text data-node="P4N4" text-anchor="middle" font-size="34" font-weight="400"><tspan x="650" y="792.4" dominant-baseline="central">Call Supabase Auth signOut({scope:&quot;local&quot;}).</tspan></text></g><g data-shape="P4N5"><polygon points="650,900.4 1170,1030.4 650,1160.4 130,1030.4" fill="white" stroke="#292929" stroke-width="3"/><text data-node="P4N5" text-anchor="middle" font-size="33" font-weight="600"><tspan x="650" y="1030.4" dominant-baseline="central">Sign-out confirmed?</tspan></text></g><g data-shape="P4N6"><polygon points="1445,955.4000000000001 2050,955.4000000000001 2015,1105.4 1410,1105.4" fill="white" stroke="#292929" stroke-width="3"/><text data-node="P4N6" text-anchor="middle" font-size="30" font-weight="400"><tspan x="1730" y="994.4000000000001" dominant-baseline="central">Show Sign out could not</tspan><tspan x="1730" y="1030.4" dominant-baseline="central">be confirmed and the</tspan><tspan x="1730" y="1066.4" dominant-baseline="central">Retry sign out button.</tspan></text></g><g data-shape="P4N7"><circle cx="1730" cy="1195.4" r="42" fill="white" stroke="#292929" stroke-width="3"/><text data-node="P4N7" text-anchor="middle" font-size="34" font-weight="600"><tspan x="1730" y="1195.4" dominant-baseline="central">A</tspan></text></g><g data-shape="P4N8"><polygon points="165,1208.4 1170,1208.4 1135,1332 130,1332" fill="white" stroke="#292929" stroke-width="3"/><text data-node="P4N8" text-anchor="middle" font-size="34" font-weight="400"><tspan x="650" y="1249.8" dominant-baseline="central">Display Login with</tspan><tspan x="650" y="1290.6" dominant-baseline="central">You have been signed out.</tspan></text></g><g data-shape="P4N9"><ellipse cx="650" cy="1428" rx="450" ry="48" fill="white" stroke="#292929" stroke-width="3"/><text data-node="P4N9" text-anchor="middle" font-size="34" font-weight="600"><tspan x="650" y="1428" dominant-baseline="central">End - Company session signed out</tspan></text></g></g></svg>