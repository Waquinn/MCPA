<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="2100" height="2970" viewBox="0 0 2100 2970" role="img" aria-labelledby="title"><title id="title">Main Admin Flowchart - page 2: Dashboard, persistent navigation and module selection</title><defs><marker id="arrow" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#292929"/></marker></defs><rect width="2100" height="2970" fill="white"/><g font-family="Arial, sans-serif" fill="#222"><text x="60" y="48" font-size="23">SITETRACE / MCPA  |  STAGE 1</text><text x="60" y="102" font-size="44">Main Admin System Flowchart</text><text x="60" y="151" font-size="31">Page 2 of 4 - Dashboard, persistent navigation and module selection</text><text x="60" y="2860" font-size="26">D returns to Dashboard loading. R retries a failed Dashboard load. The persistent sidebar and account menu also remain</text><text x="60" y="2892" font-size="26">available in loaded modules. Module details are deferred to Stage 2.</text><text x="60" y="2944" font-size="23">Source-reviewed 071ae16 | 20 October 2026 | White symbols / dark outlines | A3 portrait</text><polyline data-edge="P2E1" points="650,340 650,388" fill="none" stroke="#292929" stroke-width="3" marker-end="url(#arrow)"/><polyline data-edge="P2E2" points="650,511.6 650,559.6" fill="none" stroke="#292929" stroke-width="3" marker-end="url(#arrow)"/><polyline data-edge="P2E3" points="1170,689.6 1410,689.6" fill="none" stroke="#292929" stroke-width="3" marker-end="url(#arrow)"/><text font-size="30" font-weight="600" text-anchor="middle"><tspan x="1290" y="671.6">Yes</tspan></text><polyline data-edge="P2E4" points="650,819.6 650,867.6" fill="none" stroke="#292929" stroke-width="3" marker-end="url(#arrow)"/><text font-size="30" font-weight="600" text-anchor="start"><tspan x="684" y="850.6">No</tspan></text><polyline data-edge="P2E5" points="650,951.6 650,999.6" fill="none" stroke="#292929" stroke-width="3" marker-end="url(#arrow)"/><polyline data-edge="P2E6" points="650,1083.6 650,1131.6" fill="none" stroke="#292929" stroke-width="3" marker-end="url(#arrow)"/><polyline data-edge="P2E7" points="650,1255.1999999999998 650,1303.1999999999998" fill="none" stroke="#292929" stroke-width="3" marker-end="url(#arrow)"/><polyline data-edge="P2E8" points="1170,1433.1999999999998 1410,1433.1999999999998" fill="none" stroke="#292929" stroke-width="3" marker-end="url(#arrow)"/><text font-size="30" font-weight="600" text-anchor="middle"><tspan x="1290" y="1415.1999999999998">No</tspan></text><polyline data-edge="P2E9" points="1730,1508.1999999999998 1730,1556.1999999999998" fill="none" stroke="#292929" stroke-width="3" marker-end="url(#arrow)"/><polyline data-edge="P2E10" points="650,1563.1999999999998 650,1611.1999999999998" fill="none" stroke="#292929" stroke-width="3" marker-end="url(#arrow)"/><text font-size="30" font-weight="600" text-anchor="start"><tspan x="684" y="1594.1999999999998">Yes</tspan></text><polyline data-edge="P2E11" points="650,1734.7999999999997 650,1782.7999999999997" fill="none" stroke="#292929" stroke-width="3" marker-end="url(#arrow)"/><polyline data-edge="P2E12" points="650,1906.3999999999996 650,1954.3999999999996" fill="none" stroke="#292929" stroke-width="3" marker-end="url(#arrow)"/><polyline data-edge="P2E13" points="1170,2084.3999999999996 1410,2084.3999999999996" fill="none" stroke="#292929" stroke-width="3" marker-end="url(#arrow)"/><text font-size="30" font-weight="600" text-anchor="middle"><tspan x="1290" y="2066.3999999999996">Yes</tspan></text><polyline data-edge="P2E14" points="650,2214.3999999999996 650,2262.3999999999996" fill="none" stroke="#292929" stroke-width="3" marker-end="url(#arrow)"/><text font-size="30" font-weight="600" text-anchor="start"><tspan x="684" y="2245.3999999999996">No</tspan></text><polyline data-edge="P2E15" points="1170,2392.3999999999996 1688,2392.3999999999996" fill="none" stroke="#292929" stroke-width="3" marker-end="url(#arrow)"/><text font-size="30" font-weight="600" text-anchor="middle"><tspan x="1429" y="2374.3999999999996">Yes</tspan></text><polyline data-edge="P2E16" points="650,2522.3999999999996 650,2570.3999999999996" fill="none" stroke="#292929" stroke-width="3" marker-end="url(#arrow)"/><text font-size="30" font-weight="600" text-anchor="start"><tspan x="684" y="2553.3999999999996">No</tspan></text><g data-shape="P2N1"><polygon points="170,190 1130,190 1130,304 650,340 170,304" fill="white" stroke="#292929" stroke-width="3"/><text data-node="P2N1" text-anchor="middle" font-size="31" font-weight="400"><tspan x="650" y="231.4" dominant-baseline="central">S - From page 1</tspan><tspan x="650" y="268.6" dominant-baseline="central">Verified active Admin</tspan></text></g><g data-shape="P2N2"><rect x="130" y="388" width="1040" height="123.6" fill="white" stroke="#292929" stroke-width="3"/><text data-node="P2N2" text-anchor="middle" font-size="34" font-weight="400"><tspan x="650" y="429.40000000000003" dominant-baseline="central">Resolve the initial route using saved</tspan><tspan x="650" y="470.20000000000005" dominant-baseline="central">history / URL hash; default to Dashboard.</tspan></text></g><g data-shape="P2N3"><polygon points="650,559.6 1170,689.6 650,819.6 130,689.6" fill="white" stroke="#292929" stroke-width="3"/><text data-node="P2N3" text-anchor="middle" font-size="33" font-weight="600"><tspan x="650" y="669.8000000000001" dominant-baseline="central">Known non-Dashboard</tspan><tspan x="650" y="709.4000000000001" dominant-baseline="central">route requested?</tspan></text></g><g data-shape="P2N4"><polygon points="1410,614.6 2050,614.6 2050,728.6 1730,764.6 1410,728.6" fill="white" stroke="#292929" stroke-width="3"/><text data-node="P2N4" text-anchor="middle" font-size="30" font-weight="400"><tspan x="1730" y="656.6" dominant-baseline="central">H - To page 3</tspan><tspan x="1730" y="692.6" dominant-baseline="central">Resume the requested module</tspan></text></g><g data-shape="P2N5"><circle cx="650" cy="909.6" r="42" fill="white" stroke="#292929" stroke-width="3"/><text data-node="P2N5" text-anchor="middle" font-size="34" font-weight="600"><tspan x="650" y="909.6" dominant-baseline="central">D</tspan></text></g><g data-shape="P2N6"><circle cx="650" cy="1041.6" r="42" fill="white" stroke="#292929" stroke-width="3"/><text data-node="P2N6" text-anchor="middle" font-size="34" font-weight="600"><tspan x="650" y="1041.6" dominant-baseline="central">R</tspan></text></g><g data-shape="P2N7"><rect x="130" y="1131.6" width="1040" height="123.6" fill="white" stroke="#292929" stroke-width="3"/><text data-node="P2N7" text-anchor="middle" font-size="34" font-weight="400"><tspan x="650" y="1172.9999999999998" dominant-baseline="central">Load or reuse the Dashboard module</tspan><tspan x="650" y="1213.7999999999997" dominant-baseline="central">through showScreen(&quot;dashboard&quot;).</tspan></text></g><g data-shape="P2N8"><polygon points="650,1303.1999999999998 1170,1433.1999999999998 650,1563.1999999999998 130,1433.1999999999998" fill="white" stroke="#292929" stroke-width="3"/><text data-node="P2N8" text-anchor="middle" font-size="33" font-weight="600"><tspan x="650" y="1413.3999999999999" dominant-baseline="central">Dashboard screen</tspan><tspan x="650" y="1452.9999999999998" dominant-baseline="central">loaded?</tspan></text></g><g data-shape="P2N9"><polygon points="1445,1358.1999999999998 2050,1358.1999999999998 2015,1508.1999999999998 1410,1508.1999999999998" fill="white" stroke="#292929" stroke-width="3"/><text data-node="P2N9" text-anchor="middle" font-size="30" font-weight="400"><tspan x="1730" y="1397.1999999999998" dominant-baseline="central">Display Unable to load</tspan><tspan x="1730" y="1433.1999999999998" dominant-baseline="central">this screen. Admin selects</tspan><tspan x="1730" y="1469.1999999999998" dominant-baseline="central">Retry for this route.</tspan></text></g><g data-shape="P2N10"><circle cx="1730" cy="1598.1999999999998" r="42" fill="white" stroke="#292929" stroke-width="3"/><text data-node="P2N10" text-anchor="middle" font-size="34" font-weight="600"><tspan x="1730" y="1598.1999999999998" dominant-baseline="central">R</tspan></text></g><g data-shape="P2N11"><polygon points="165,1611.1999999999998 1170,1611.1999999999998 1135,1734.7999999999997 130,1734.7999999999997" fill="white" stroke="#292929" stroke-width="3"/><text data-node="P2N11" text-anchor="middle" font-size="34" font-weight="400"><tspan x="650" y="1652.5999999999997" dominant-baseline="central">Display Admin Dashboard</tspan><tspan x="650" y="1693.3999999999996" dominant-baseline="central">and the available Admin modules.</tspan></text></g><g data-shape="P2N12"><polygon points="165,1782.7999999999997 1170,1782.7999999999997 1135,1906.3999999999996 130,1906.3999999999996" fill="white" stroke="#292929" stroke-width="3"/><text data-node="P2N12" text-anchor="middle" font-size="34" font-weight="400"><tspan x="650" y="1824.1999999999996" dominant-baseline="central">Admin selects a module or Dashboard</tspan><tspan x="650" y="1864.9999999999995" dominant-baseline="central">from persistent navigation, or selects Log Out.</tspan></text></g><g data-shape="P2N13"><polygon points="650,1954.3999999999996 1170,2084.3999999999996 650,2214.3999999999996 130,2084.3999999999996" fill="white" stroke="#292929" stroke-width="3"/><text data-node="P2N13" text-anchor="middle" font-size="33" font-weight="600"><tspan x="650" y="2084.3999999999996" dominant-baseline="central">Log Out selected?</tspan></text></g><g data-shape="P2N14"><polygon points="1410,2009.3999999999996 2050,2009.3999999999996 2050,2123.3999999999996 1730,2159.3999999999996 1410,2123.3999999999996" fill="white" stroke="#292929" stroke-width="3"/><text data-node="P2N14" text-anchor="middle" font-size="30" font-weight="400"><tspan x="1730" y="2051.3999999999996" dominant-baseline="central">L - To page 4</tspan><tspan x="1730" y="2087.3999999999996" dominant-baseline="central">Perform the verified logout</tspan></text></g><g data-shape="P2N15"><polygon points="650,2262.3999999999996 1170,2392.3999999999996 650,2522.3999999999996 130,2392.3999999999996" fill="white" stroke="#292929" stroke-width="3"/><text data-node="P2N15" text-anchor="middle" font-size="33" font-weight="600"><tspan x="650" y="2392.3999999999996" dominant-baseline="central">Dashboard selected?</tspan></text></g><g data-shape="P2N16"><circle cx="1730" cy="2392.3999999999996" r="42" fill="white" stroke="#292929" stroke-width="3"/><text data-node="P2N16" text-anchor="middle" font-size="34" font-weight="600"><tspan x="1730" y="2392.3999999999996" dominant-baseline="central">D</tspan></text></g><g data-shape="P2N17"><polygon points="170,2570.3999999999996 1130,2570.3999999999996 1130,2684.3999999999996 650,2720.3999999999996 170,2684.3999999999996" fill="white" stroke="#292929" stroke-width="3"/><text data-node="P2N17" text-anchor="middle" font-size="31" font-weight="400"><tspan x="650" y="2611.7999999999997" dominant-baseline="central">N - To page 3</tspan><tspan x="650" y="2648.9999999999995" dominant-baseline="central">Navigate to the selected module</tspan></text></g></g></svg>