<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2635" viewBox="0 0 1600 2635"><title>Admin / Tools and Equipment Masterlist / page 14</title><desc>Export the filtered masterlist through browser print</desc><defs><marker id="arrow" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 11 5 L 0 10 Z" fill="black"/></marker></defs><rect width="1600" height="2635" fill="white"/><g font-family="Arial, sans-serif" fill="black"><text x="80" y="55" font-size="26" text-anchor="start" ><tspan x="80" dy="0">SITETRACE (MCPA) - Admin</tspan></text><text x="80" y="105" font-size="36" text-anchor="start" ><tspan x="80" dy="0">Tools and Equipment Masterlist</tspan></text><text x="80" y="177" font-size="25" text-anchor="start" ><tspan x="80" dy="0">Page 14 of 14 | Export the filtered masterlist through browser print</tspan></text><text x="80" y="2580" font-size="22" text-anchor="start" ><tspan x="80" dy="0">21 October 2026 | Source-verified documentation | ADMIN_MASTERLIST | Legal portrait</tspan></text><text x="560" y="252" font-size="24" text-anchor="start" ><tspan x="560" dy="0">From Admin / Tools and Equipment Masterlist / Export the filtered masterlist through</tspan><tspan x="560" dy="28.799999999999997">browser print</tspan></text><polyline data-edge="e1" points="485,306 485,354" fill="none" stroke="black" stroke-width="2.5" marker-end="url(#arrow)"/><polyline data-edge="e2" points="485,459 485,507" fill="none" stroke="black" stroke-width="2.5" marker-end="url(#arrow)"/><polyline data-edge="e3" points="485,617 485,665" fill="none" stroke="black" stroke-width="2.5" marker-end="url(#arrow)"/><polyline data-edge="e4" points="485,775 485,823" fill="none" stroke="black" stroke-width="2.5" marker-end="url(#arrow)"/><polyline data-edge="e5" points="485,933 485,981" fill="none" stroke="black" stroke-width="2.5" marker-end="url(#arrow)"/><polyline data-edge="e6" points="485,1086 485,1134" fill="none" stroke="black" stroke-width="2.5" marker-end="url(#arrow)"/><polyline data-edge="e7" points="485,1280 485,1328" fill="none" stroke="black" stroke-width="2.5" marker-end="url(#arrow)"/><g data-node="n1"><polygon points="435,220 535,220 535,278 485,306 435,278" stroke="black" stroke-width="2.5" fill="white"/><text x="485" y="264" font-size="28" text-anchor="middle" ><tspan x="485" dy="0">AO</tspan></text></g><g data-node="n2"><polygon points="173,354 835,354 797,459 135,459" stroke="black" stroke-width="2.5" fill="white"/><text x="485" y="416.5" font-size="30" text-anchor="middle" ><tspan x="485" dy="0">Set inventory filters and choose Export</tspan></text></g><g data-node="n3"><rect x="135" y="507" width="700" height="110" stroke="black" stroke-width="2.5" fill="white"/><text x="485" y="554" font-size="30" text-anchor="middle" ><tspan x="485" dy="0">Collect every filtered record across pages; build</tspan><tspan x="485" dy="36">dated inventory receipt</tspan></text></g><g data-node="n4"><rect x="135" y="665" width="700" height="110" stroke="black" stroke-width="2.5" fill="white"/><text x="485" y="712" font-size="30" text-anchor="middle" ><tspan x="485" dy="0">Open popup with asset ID, name, category,</tspan><tspan x="485" dy="36">location, holder and recorded status</tspan></text></g><g data-node="n5"><polygon points="173,823 835,823 797,933 135,933" stroke="black" stroke-width="2.5" fill="white"/><text x="485" y="870" font-size="30" text-anchor="middle" ><tspan x="485" dy="0">Browser print dialog: choose printer or Save</tspan><tspan x="485" dy="36">as PDF, or cancel</tspan></text></g><g data-node="n6"><rect x="135" y="981" width="700" height="105" stroke="black" stroke-width="2.5" fill="white"/><text x="485" y="1043.5" font-size="30" text-anchor="middle" ><tspan x="485" dy="0">Close the export window after print is invoked</tspan></text></g><g data-node="n7"><polygon points="173,1134 835,1134 797,1280 135,1280" stroke="black" stroke-width="2.5" fill="white"/><text x="485" y="1181" font-size="30" text-anchor="middle" ><tspan x="485" dy="0">User controls browser print output; no</tspan><tspan x="485" dy="36">database write. Popup/print failure has no</tspan><tspan x="485" dy="36">explicit application recovery handler.</tspan></text></g><g data-node="n8"><ellipse cx="485" cy="1374" rx="280" ry="46" stroke="black" stroke-width="2.5" fill="white"/><text x="485" y="1384" font-size="30" text-anchor="middle" ><tspan x="485" dy="0">END</tspan></text></g></g></svg>