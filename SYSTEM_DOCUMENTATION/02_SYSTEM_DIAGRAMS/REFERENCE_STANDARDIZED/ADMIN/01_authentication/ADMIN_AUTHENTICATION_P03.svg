estoration, or</tspan><tspan x="485" dy="36">signInWithPassword for submitted credentials.</tspan></text></g><g data-node="n4"><polygon points="485,670 825,785 485,900 145,785" stroke="black" stroke-width="2.5" fill="white"/><text x="485" y="777" font-size="30" text-anchor="middle" ><tspan x="485" dy="0">Authenticated session</tspan><tspan x="485" dy="36">available?</tspan></text></g><g data-node="n5"><polygon points="1023,694 1475,694 1437,876 985,876" stroke="black" stroke-width="2.5" fill="white"/><text x="1230" y="741" font-size="30" text-anchor="middle" ><tspan x="1230" dy="0">No existing session: show</tspan><tspan x="1230" dy="36">normal sign-in.</tspan><tspan x="1230" dy="36">Submitted login failure: show</tspan><tspan x="1230" dy="36">error and retry.</tspan></text></g><g data-node="n6"><circle cx="62" cy="409" r="32" stroke="black" stroke-width="2.5" fill="white"/><text x="62" y="419" font-size="28" text-anchor="middle" ><tspan x="62" dy="0">1</tspan></text></g><g data-node="n7"><circle cx="1230" cy="956" r="32" stroke="black" stroke-width="2.5" fill="white"/><text x="1230" y="966" font-size="28" text-anchor="middle" ><tspan x="1230" dy="0">1</tspan></text></g><g data-node="n8"><rect x="135" y="1036" width="700" height="110" stroke="black" stroke-width="2.5" fill="white"/><text x="485" y="1083" font-size="30" text-anchor="middle" ><tspan x="485" dy="0">Clear submitted password after sign-in;</tspan><tspan x="485" dy="36">read mcpa_my_profile for the session user.</tspan></text></g><g data-node="n9"><polygon points="485,1194 825,1309 485,1424 145,1309" stroke="black" stroke-width="2.5" fill="white"/><text x="485" y="1319" font-size="30" text-anchor="middle" ><tspan x="485" dy="0">Profile read succeeds?</tspan></text></g><g data-node="n10"><polygon points="1023,1218 1475,1218 1437,1400 985,1400" stroke="black" stroke-width="2.5" fill="white"/><text x="1230" y="1265" font-size="30" text-anchor="middle" ><tspan x="1230" dy="0">Show profile-verification</tspan>