,960 835,960 797,1070 135,1070" stroke="black" stroke-width="2.5" fill="white"/><text x="485" y="1007" font-size="30" text-anchor="middle" ><tspan x="485" dy="0">Show Repair completed; tool recorded</tspan><tspan x="485" dy="36">AVAILABLE at selected project</tspan></text></g><g data-node="n7"><polygon points="173,1118 835,1118 797,1264 135,1264" stroke="black" stroke-width="2.5" fill="white"/><text x="485" y="1165" font-size="30" text-anchor="middle" ><tspan x="485" dy="0">Repair closed. Request availability also</tspan><tspan x="485" dy="36">depends on separate condition metadata</tspan><tspan x="485" dy="36">and existing movement locks.</tspan></text></g><g data-node="n8"><ellipse cx="485" cy="1358" rx="280" ry="46" stroke="black" stroke-width="2.5" fill="white"/><text x="485" y="1368" font-size="30" text-anchor="middle" ><tspan x="485" dy="0">END</tspan></text></g></g></svg>