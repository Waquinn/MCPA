<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2635" viewBox="0 0 1600 2635"><title>Admin / Notifications / Own-Recipient Monitoring / page 5</title><desc>Mark all currently loaded unread notices</desc><defs><marker id="arrow" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 11 5 L 0 10 Z" fill="black"/></marker></defs><rect width="1600" height="2635" fill="white"/><g font-family="Arial, sans-serif" fill="black"><text x="80" y="55" font-size="26" text-anchor="start" ><tspan x="80" dy="0">SITETRACE (MCPA) - Admin</tspan></text><text x="80" y="105" font-size="36" text-anchor="start" ><tspan x="80" dy="0">Notifications / Own-Recipient Monitoring</tspan></text><text x="80" y="177" font-size="25" text-anchor="start" ><tspan x="80" dy="0">Page 5 of 6 | Mark all currently loaded unread notices</tspan></text><text x="80" y="2580" font-size="22" text-anchor="start" ><tspan x="80" dy="0">21 October 2026 | Source-verified documentation | ADMIN_NOTIFICATIONS | Legal portrait</tspan></text><text x="560" y="252" font-size="24" text-anchor="start" ><tspan x="560" dy="0">From Admin / Notifications / Own-Recipient Monitoring / Mark all currently loaded</tspan><tspan x="560" dy="28.799999999999997">unread notices</tspan></text><polyline data-edge="e1" points="485,306 485,354" fill="none" stroke="black" stroke-width="2.5" marker-end="url(#arrow)"/><polyline data-edge="e2" points="485,459 485,507" fill="none" stroke="black" stroke-width="2.5" marker-end="url(#arrow)"/><polyline data-edge="e3" points="485,617 485,665" fill="none" stroke="black" stroke-width="2.5" marker-end="url(#arrow)"/><polyline data-edge="e4" points="485,775 485,823" fill="none" stroke="black" stroke-width="2.5" marker-end="url(#arrow)"/><polyline data-edge="e5" points="825,938 985,938" fill="none" stroke="black" stroke-width="2.5" marker-end="url(#arrow)"/><text x="905" y="923" font-size="26" text-anchor="middle" ><tspan x="905" dy="0">No</tspan></text><polyline data-edge="e6" points="94,406.5 135,406.5" fill="none" stroke="black" stroke-width="2.5" marker-end="url(#arrow)"/><polyline data-edge="e7" points="1230,1047 1230,1095" fill="none" stroke="black" stroke-width="2.5" marker-end="url(#arrow)"/><polyline data-edge="e8" points="485,1053 485,1207" fill="none" stroke="black" stroke-width="2.5" marker-end="url(#arrow)"/><text x="505" y="1138" font-size="26" text-anchor="start" ><tspan x="505" dy="0">Yes</tspan></text><polyline data-edge="e9" points="485,1317 485,1365" fill="none" stroke="black" stroke-width="2.5" marker-end="url(#arrow)"/><polyline data-edge="e10" points="485,1475 485,1523" fill="none" stroke="black" stroke-width="2.5" marker-end="url(#arrow)"/><polyline data-edge="e11" points="485,1633 485,1681" fill="none" stroke="black" stroke-width="2.5" marker-end="url(#arrow)"/><g data-node="n1"><polygon points="435,220 535,220 535,278 485,306 435,278" stroke="black" stroke-width="2.5" fill="white"/><text x="485" y="264" font-size="28" text-anchor="middle" ><tspan x="485" dy="0">FS</tspan></text></g><g data-node="n2"><polygon points="173,354 835,354 797,459 135,459" stroke="black" stroke-width="2.5" fill="white"/><text x="485" y="416.5" font-size="30" text-anchor="middle" ><tspan x="485" dy="0">Choose Mark all as read after notices load</tspan></text></g><g data-node="n3"><rect x="135" y="507" width="700" height="110" stroke="black" stroke-width="2.5" fill="white"/><text x="485" y="554" font-size="30" text-anchor="middle" ><tspan x="485" dy="0">Freeze the IDs of currently loaded unread</tspan><tspan x="485" dy="36">notices; disable overlapping writes</tspan></text></g><g data-node="n4"><rect x="135" y="665" width="700" height="110" stroke="black" stroke-width="2.5" fill="white"/><text x="485" y="712" font-size="30" text-anchor="middle" ><tspan x="485" dy="0">For each ID, call mcpa_monitoring_mark_read;</tspan><tspan x="485" dy="36">update count only after server confirmation</tspan></text></g><g data-node="n5"><polygon points="485,823 825,938 485,1053 145,938" stroke="black" stroke-width="2.5" fill="white"/><text x="485" y="930" font-size="30" text-anchor="middle" ><tspan x="485" dy="0">Every frozen notice write</tspan><tspan x="485" dy="36">succeeds?</tspan></text></g><g data-node="n6"><polygon points="1023,829 1475,829 1437,1047 985,1047" stroke="black" stroke-width="2.5" fill="white"/><text x="1230" y="876" font-size="30" text-anchor="middle" ><tspan x="1230" dy="0">Show number confirmed and</tspan><tspan x="1230" dy="36">partial-failure message;</tspan><tspan x="1230" dy="36">retain completed changes</tspan><tspan x="1230" dy="36">Retry Mark all as read for</tspan><tspan x="1230" dy="36">notices still unread</tspan></text></g><g data-node="n7"><circle cx="62" cy="406.5" r="32" stroke="black" stroke-width="2.5" fill="white"/><text x="62" y="416.5" font-size="28" text-anchor="middle" ><tspan x="62" dy="0">1</tspan></text></g><g data-node="n8"><circle cx="1230" cy="1127" r="32" stroke="black" stroke-width="2.5" fill="white"/><text x="1230" y="1137" font-size="28" text-anchor="middle" ><tspan x="1230" dy="0">1</tspan></text></g><g data-node="n9"><rect x="135" y="1207" width="700" height="110" stroke="black" stroke-width="2.5" fill="white"/><text x="485" y="1254" font-size="30" text-anchor="middle" ><tspan x="485" dy="0">Re-read monitoring snapshot after all writes,</tspan><tspan x="485" dy="36">including a partial failure</tspan></text></g><g data-node="n10"><polygon points="173,1365 835,1365 797,1475 135,1475" stroke="black" stroke-width="2.5" fill="white"/><text x="485" y="1412" font-size="30" text-anchor="middle" ><tspan x="485" dy="0">Show reconciled read count; new notices</tspan><tspan x="485" dy="36">received during the batch remain unread</tspan></text></g><g data-node="n11"><polygon points="173,1523 835,1523 797,1633 135,1633" stroke="black" stroke-width="2.5" fill="white"/><text x="485" y="1570" font-size="30" text-anchor="middle" ><tspan x="485" dy="0">Confirmed notice reads are retained without</tspan><tspan x="485" dy="36">erasing newly arrived unread notices.</tspan></text></g><g data-node="n12"><ellipse cx="485" cy="1727" rx="280" ry="46" stroke="black" stroke-width="2.5" fill="white"/><text x="485" y="1737" font-size="30" text-anchor="middle" ><tspan x="485" dy="0">END</tspan></text></g></g></svg>