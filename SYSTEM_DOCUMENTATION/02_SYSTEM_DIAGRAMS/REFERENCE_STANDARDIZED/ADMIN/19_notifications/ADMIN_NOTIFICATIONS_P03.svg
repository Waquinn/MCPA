<rect x="135" y="507" width="700" height="110" stroke="black" stroke-width="2.5" fill="white"/><text x="485" y="554" font-size="30" text-anchor="middle" ><tspan x="485" dy="0">If unread, call mcpa_monitoring_mark_read</tspan><tspan x="485" dy="36">with this notice ID; verify same active profile</tspan></text></g><g data-node="n4"><polygon points="485,665 825,792.5 485,920 145,792.5" stroke="black" stroke-width="2.5" fill="white"/><text x="485" y="766.5" font-size="30" text-anchor="middle" ><tspan x="485" dy="0">Own-recipient mark-read</tspan><tspan x="485" dy="36">is confirmed, or the notice</tspan><tspan x="485" dy="36">was already read?</tspan></text></g><g data-node="n5"><polygon points="1023,665.5 1475,665.5 1437,919.5 985,919.5" stroke="black" stroke-width="2.5" fill="white"/><text x="1230" y="712.5" font-size="30" text-anchor="middle" ><tspan x="1230" dy="0">Show read state not</tspan><tspan x="1230" dy="36">confirmed; keep notification</tspan><tspan x="1230" dy="36">dialog</tspan><tspan x="1230" dy="36">Retry selecting the notice;</tspan><tspan x="1230" dy="36">setup / permission failures</tspan><tspan x="1230" dy="36">need service correction</tspan></text></g><g data-node="n6"><circle cx="62" cy="406.5" r="32" stroke="black" stroke-width="2.5" fill="white"/><text x="62" y="416.5" font-size="28" text-anchor="middle" ><tspan x="62" dy="0">1</tspan></text></g><g data-node="n7"><circle cx="1230" cy="999.5" r="32" stroke="black" stroke-width="2.5" fill="white"/><text x="1230" y="1009.5" font-size="28" text-anchor="middle" ><tspan x="1230" dy="0">1</tspan></text></g><g data-node="n8"><rect x="135" y="1079.5" width="700" height="110" stroke="black" stroke-width="2.5" fill="white"/><text x="485" y="1126.5" font-size="30" text-anchor="middle" ><tspan x="485" dy="0">Update local read time/count; resolve stable</tspan><tspan x="485" dy="36">record route from notice kind and data</tspan></text></g><g data-node="n9"><polygon points="485,1237.5 825,1352.5 485,1467.5 145,1352.5" stroke="black" stroke-width="2.5" fill="white"/><text x="485" y="1344.5" font-size="30" text-anchor="middle" ><tspan x="485" dy="0">Current role can access</tspan><tspan x="485" dy="36">the resolved destination?</tspan></text></g><g data-node="n10"><polygon points="1023,1279.5 1475,1279.5 1437,1425.5 985,1425.5" stroke="black" stroke-width="2.5" fill="white"/><text x="1230" y="1326.5" font-size="30" text-anchor="middle" ><tspan x="1230" dy="0">Close dialog and refresh</tspan><tspan x="1230" dy="36">notices without opening an</tspan><tspan x="1230" dy="36">unauthorized route</tspan></text></g><g data-node="n11"><ellipse cx="1230" cy="1519.5" rx="245" ry="46" stroke="black" stroke-width="2.5" fill="white"/><text x="1230" y="1529.5" font-size="30" text-anchor="middle" ><tspan x="1230" dy="0">END ATTEMPT</tspan></text></g><g data-node="n12"><polygon points="173,1613.5 835,1613.5 797,1759.5 135,1759.5" stroke="black" stroke-width="2.5" fill="white"/><text x="485" y="1660.5" font-size="30" text-anchor="middle" ><tspan x="485" dy="0">Open request, transfer, return, repair,</tspan><tspan x="485" dy="36">missing, reports, masterlist or activity;</tspan><tspan x="485" dy="36">refresh notice state</tspan></text></g><g data-node="n13"><polygon points="435,1807.5 535,1807.5 535,1865.5 485,1893.5 435,1865.5" stroke="black" stroke-width="2.5" fill="white"/><text x="485" y="1851.5" font-size="28" text-anchor="middle" ><tspan x="485" dy="0">FU</tspan></text></g></g></svg>