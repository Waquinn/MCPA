<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2635" viewBox="0 0 1600 2635"><title>Admin / Global Search / Authorized Record Discovery / page 5</title><desc>Clear or close search</desc><defs><marker id="arrow" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 11 5 L 0 10 Z" fill="black"/></marker></defs><rect width="1600" height="2635" fill="white"/><g font-family="Arial, sans-serif" fill="black"><text x="80" y="55" font-size="26" text-anchor="start" ><tspan x="80" dy="0">SITETRACE (MCPA) - Admin</tspan></text><text x="80" y="105" font-size="36" text-anchor="start" ><tspan x="80" dy="0">Global Search / Authorized Record Discovery</tspan></text><text x="80" y="177" font-size="25" text-anchor="start" ><tspan x="80" dy="0">Page 5 of 5 | Clear or close search</tspan></text><text x="80" y="2580" font-size="22" text-anchor="start" ><tspan x="80" dy="0">21 October 2026 | Source-verified documentation | ADMIN_GLOBAL_SEARCH | Legal portrait</tspan></text><text x="560" y="252" font-size="24" text-anchor="start" ><tspan x="560" dy="0">From Admin / Global Search / Authorized Record Discovery / Clear or close search</tspan></text><polyline data-edge="e1" points="485,306 485,354" fill="none" stroke="black" stroke-width="2.5" marker-end="url(#arrow)"/><polyline data-edge="e2" points="485,464 485,512" fill="none" stroke="black" stroke-width="2.5" marker-end="url(#arrow)"/><polyline data-edge="e3" points="485,658 485,706" fill="none" stroke="black" stroke-width="2.5" marker-end="url(#arrow)"/><polyline data-edge="e4" points="485,816 485,864" fill="none" stroke="black" stroke-width="2.5" marker-end="url(#arrow)"/><polyline data-edge="e5" points="485,974 485,1022" fill="none" stroke="black" stroke-width="2.5" marker-end="url(#arrow)"/><g data-node="n1"><polygon points="435,220 535,220 535,278 485,306 435,278" stroke="black" stroke-width="2.5" fill="white"/><text x="485" y="264" font-size="28" text-anchor="middle" ><tspan x="485" dy="0">FO</tspan></text></g><g data-node="n2"><polygon points="173,354 835,354 797,464 135,464" stroke="black" stroke-width="2.5" fill="white"/><text x="485" y="401" font-size="30" text-anchor="middle" ><tspan x="485" dy="0">Choose Clear, press Escape, or click</tspan><tspan x="485" dy="36">outside results</tspan></text></g><g data-node="n3"><rect x="135" y="512" width="700" height="146" stroke="black" stroke-width="2.5" fill="white"/><text x="485" y="559" font-size="30" text-anchor="middle" ><tspan x="485" dy="0">Cancel pending search generation; close result</tspan><tspan x="485" dy="36">panel; Clear also empties query and restores</tspan><tspan x="485" dy="36">input focus</tspan></text></g><g data-node="n4"><rect x="135" y="706" width="700" height="110" stroke="black" stroke-width="2.5" fill="white"/><text x="485" y="753" font-size="30" text-anchor="middle" ><tspan x="485" dy="0">Invalidate cached results after movement</tspan><tspan x="485" dy="36">change or identity/session reset</tspan></text></g><g data-node="n5"><polygon points="173,864 835,864 797,974 135,974" stroke="black" stroke-width="2.5" fill="white"/><text x="485" y="911" font-size="30" text-anchor="middle" ><tspan x="485" dy="0">Search is dismissed without changing</tspan><tspan x="485" dy="36">application records.</tspan></text></g><g data-node="n6"><ellipse cx="485" cy="1068" rx="280" ry="46" stroke="black" stroke-width="2.5" fill="white"/><text x="485" y="1078" font-size="30" text-anchor="middle" ><tspan x="485" dy="0">END</tspan></text></g></g></svg>