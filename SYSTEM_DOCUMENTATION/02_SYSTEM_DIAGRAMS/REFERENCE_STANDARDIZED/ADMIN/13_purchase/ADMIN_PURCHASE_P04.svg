="n3"><polygon points="173,548 835,548 797,694 135,694" stroke="black" stroke-width="2.5" fill="white"/><text x="485" y="595" font-size="30" text-anchor="middle" ><tspan x="485" dy="0">Add 1-100 item lines: description, positive</tspan><tspan x="485" dy="36">quantity (3 decimals) and unit price (2</tspan><tspan x="485" dy="36">decimals)</tspan></text></g><g data-node="n4"><rect x="135" y="742" width="700" height="146" stroke="black" stroke-width="2.5" fill="white"/><text x="485" y="789" font-size="30" text-anchor="middle" ><tspan x="485" dy="0">Preview sum of rounded line totals; optionally</tspan><tspan x="485" dy="36">select PDF/JPEG/PNG/WebP receipt up to 10</tspan><tspan x="485" dy="36">MB</tspan></text></g><g data-node="n5"><polygon points="485,936 825,1063.5 485,1191 145,1063.5" stroke="black" stroke-width="2.5" fill="white"/><text x="485" y="1037.5" font-size="30" text-anchor="middle" ><tspan x="485" dy="0">Required fields and</tspan><tspan x="485" dy="36">optional nonempty receipt</tspan><tspan x="485" dy="36">type / size are valid?</tspan></text></g><g data-node="n6"><polygon points="1023,990.5 1475,990.5 1437,1136.5 985,1136.5" stroke="black" stroke-width="2.5" fill="white"/><text x="1230" y="1037.5" font-size="30" text-anchor="middle" ><tspan x="1230" dy="0">Show form / attachment</tspan><tspan x="1230" dy="36">error; retain input and</tspan><tspan x="1230" dy="36">correct it</tspan></text></g><g data-node="n7"><circle cx="62" cy="621" r="32" stroke="black" stroke-width="2.5" fill="white"/><text x="62" y="631" font-size="28" text-anchor="middle" ><tspan x="62" dy="0">1</tspan></text></g><g data-node="n8"><circle cx="1230" cy="1216.5" r="32" stroke="black" stroke-width="2.5" fill="white"/><text x="1230" y="1226.5" font-size="28" text-anchor="middle" ><tspan x="1230" dy="0">1</tspan></text></g><g data-node="n9"><rect x="135" y="1296.5" width="700" height="146" stroke="black" stroke-width="2.5" fill="white"/><text x="485" y="1343.5" font-size="30" text-anchor="middle" ><tspan x="485" dy="0">Upload selected receipt to private</tspan><tspan x="485" dy="36">purchase-receipts bucket; retain staged path for</tspan><tspan x="485" dy="36">retry</tspan></text></g><g data-node="n10"><polygon points="485,1490.5 825,1605.5 485,1720.5 145,1605.5" stroke="black" stroke-width="2.5" fill="white"/><text x="485" y="1597.5" font-size="30" text-anchor="middle" ><tspan x="485" dy="0">Optional receipt upload</tspan><tspan x="485" dy="36">succeeds?</tspan></text></g><g data-node="n11"><polygon points="1023,1514.5 1475,1514.5 1437,1696.5 985,1696.5" stroke="black" stroke-width="2.5" fill="white"/><text x="1230" y="1561.5" font-size="30" text-anchor="middle" ><tspan x="1230" dy="0">Show receipt upload error;</tspan><tspan x="1230" dy="36">retain form</tspan><tspan x="1230" dy="36">Check connection and retry</tspan><tspan x="1230" dy="36">the same form</tspan></text></g><g data-node="n12"><circle cx="1230" cy="1776.5" r="32" stroke="black" stroke-width="2.5" fill="white"/><text x="1230" y="1786.5" font-size="28" text-anchor="middle" ><tspan x="1230" dy="0">1</tspan></text></g><g data-node="n13"><polygon points="435,1856.5 535,1856.5 535,1914.5 485,1942.5 435,1914.5" stroke="black" stroke-width="2.5" fill="white"/><text x="485" y="1900.5" font-size="28" text-anchor="middle" ><tspan x="485" dy="0">EG</tspan></text></g></g></svg>