<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2635" viewBox="0 0 1600 2635"><title>Admin / Purchases / Recorded Purchase Ledger / page 4</title><desc>Record a purchase - 1 / 3</desc><defs><marker id="arrow" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 11 5 L 0 10 Z" fill="black"/></marker></defs><rect width="1600" height="2635" fill="white"/><g font-family="Arial, sans-serif" fill="black"><text x="80" y="55" font-size="26" text-anchor="start" ><tspan x="80" dy="0">SITETRACE (MCPA) - Admin</tspan></text><text x="80" y="105" font-size="36" text-anchor="start" ><tspan x="80" dy="0">Purchases / Recorded Purchase Ledger</tspan></text><text x="80" y="177" font-size="25" text-anchor="start" ><tspan x="80" dy="0">Page 4 of 11 | Record a purchase - 1 / 3</tspan></text><text x="80" y="2580" font-size="22" text-anchor="start" ><tspan x="80" dy="0">21 October 2026 | Source-verified documentation | ADMIN_PURCHASE | Legal portrait</tspan></text><text x="560" y="252" font-size="24" text-anchor="start" ><tspan x="560" dy="0">From Admin / Purchases / Recorded Purchase Ledger / Record a purchase</tspan></text><text x="560" y="1886.5" font-size="24" text-anchor="start" ><tspan x="560" dy="0">Continue on next page</tspan></text><text x="557" y="1931.5" font-size="19" text-anchor="start" ><tspan x="557" dy="0">To ADMIN PURCHASE / P5</tspan></text><polyline data-edge="e1" points="485,306 485,354" fill="none" stroke="black" stroke-width="2.5" marker-end="url(#arrow)"/><polyline data-edge="e2" points="485,500 485,548" fill="none" stroke="black" stroke-width="2.5" marker-end="url(#arrow)"/><polyline data-edge="e3" points="485,694 485,742" fill="none" stroke="black" stroke-width="2.5" marker-end="url(#arrow)"/><polyline data-edge="e4" points="485,888 485,936" fill="none" stroke="black" stroke-width="2.5" marker-end="url(#arrow)"/><polyline data-edge="e5" points="825,1063.