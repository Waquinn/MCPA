; verify actual</tspan><tspan x="485" dy="36">person/email in Supabase Authentication</tspan><tspan x="485" dy="36">externally</tspan></text></g><g data-node="n3"><polygon points="173,548 835,548 797,694 135,694" stroke="black" stroke-width="2.5" fill="white"/><text x="485" y="595" font-size="30" text-anchor="middle" ><tspan x="485" dy="0">Select unlinked company person or create a</tspan><tspan x="485" dy="36">new person; supply supported role, verified</tspan><tspan x="485" dy="36">Auth UUID and status</tspan></text></g><g data-node="n4"><polygon points="485,742 825,869.5 485,997 145,869.5" stroke="black" stroke-width="2.5" fill="white"/><text x="485" y="843.5" font-size="30" text-anchor="middle" ><tspan x="485" dy="0">Required identity fields</tspan><tspan x="485" dy="36">and Auth UUID format are</tspan><tspan x="485" dy="36">valid?</tspan></text></g><g data-node="n5"><polygon points="1023,814.5 1475,814.5 1437,924.5 985,924.5" stroke="black" stroke-width="2.5" fill="white"/><text x="1230" y="861.5" font-size="30" text-anchor="middle" ><tspan x="1230" dy="0">Keep form open; correct</tspan><tspan x="1230" dy="36">verified identity / UUID</tspan></text></g><g data-node="n6"><circle cx="62" cy="621" r="32" stroke="black" stroke-width="2.5" fill="white"/><text x="62" y="631" font-size="28" text-anchor="middle" ><tspan x="62" dy="0">1</tspan></text></g><g data-node="n7"><circle cx="1230" cy="1004.5" r="32" stroke="black" stroke-width="2.5" fill="white"/><text x="1230" y="1014.5" font-size="28" text-anchor="middle" ><tspan x="1230" dy="0">1</tspan></text></g><g data-node="n8"><rect x="135" y="1084.5" width="700" height="146" stroke="black" stroke-width="2.5" fill="white"/><text x="485" y="1131.5" font-size="30" text-anchor="middle" ><tspan x="485" dy="0">Call mcpa_save_account; server verifies</tspan><tspan x="485" dy="36">existing Auth identity and immutable existing</tspan><tspan x="485" dy="36">links</tspan></text></g><g data-node="n9"><polygon points="485,1278.5 825,1441 485,1603.5 145,1441" stroke="black" stroke-width="2.5" fill="white"/><text x="485" y="1397" font-size="30" text-anchor="middle" ><tspan x="485" dy="0">Auth account exists, is not</tspan><tspan x="485" dy="36">linked elsewhere, and all</tspan><tspan x="485" dy="36">identity / Admin rules</tspan><tspan x="485" dy="36">pass?</tspan></text></g><g data-node="n10"><polygon points="1023,1314 1475,1314 1437,1568 985,1568" stroke="black" stroke-width="2.5" fill="white"/><text x="1230" y="1361" font-size="30" text-anchor="middle" ><tspan x="1230" dy="0">Reject duplicate person,</tspan><tspan x="1230" dy="36">reassigned link, new Admin</tspan><tspan x="1230" dy="36">or invalid activation</tspan><tspan x="1230" dy="36">Show error; verify the</tspan><tspan x="1230" dy="36">intended identity and retry</tspan><tspan x="1230" dy="36">correct linking</tspan></text></g><g data-node="n11"><circle cx="1230" cy="1648" r="32" stroke="black" stroke-width="2.5" fill="white"/><text x="1230" y="1658" font-size="28" text-anchor="middle" ><tspan x="1230" dy="0">1</tspan></text></g><g data-node="n12"><polygon points="173,1728 835,1728 797,1838 135,1838" stroke="black" stroke-width="2.5" fill="white"/><text x="485" y="1775" font-size="30" text-anchor="middle" ><tspan x="485" dy="0">Reset recovery form; reload people; show</tspan><tspan x="485" dy="36">account linked and accountability retained</tspan></text></g><g data-node="n13"><polygon points="435,1886 535,1886 535,1944 485,1972 435,1944" stroke="black" stroke-width="2.5" fill="white"/><text x="485" y="1930" font-size="28" text-anchor="middle" ><tspan x="485" dy="0">FJ</tspan></text></g></g></svg>