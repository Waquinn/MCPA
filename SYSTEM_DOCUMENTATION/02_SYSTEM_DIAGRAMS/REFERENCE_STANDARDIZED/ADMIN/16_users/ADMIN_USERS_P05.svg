ad people and</tspan><tspan x="485" dy="36">capabilities; show sent or already-sent</tspan><tspan x="485" dy="36">confirmation</tspan></text></g><g data-node="n11"><polygon points="173,1654 835,1654 797,1800 135,1800" stroke="black" stroke-width="2.5" fill="white"/><text x="485" y="1701" font-size="30" text-anchor="middle" ><tspan x="485" dy="0">A verified invitation is linked to one company</tspan><tspan x="485" dy="36">identity; recipient receives account setup</tspan><tspan x="485" dy="36">email.</tspan></text></g><g data-node="n12"><ellipse cx="485" cy="1894" rx="280" ry="46" stroke="black" stroke-width="2.5" fill="white"/><text x="485" y="1904" font-size="30" text-anchor="middle" ><tspan x="485" dy="0">END</tspan></text></g></g></svg>